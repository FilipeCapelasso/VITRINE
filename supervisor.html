<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--r:#c80000;--r2:#a00000;--ink:#14151a;--mut:#5a6070;--line:#e2e4ea;--bg:#f4f5f8;--ok:#0f8a5f;--er:#b3261e;--card:#fff}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit}
.top{background:var(--ink);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top b{font-size:18px}.top small{opacity:.7}.top .sp{flex:1}
.wrap{max-width:980px;margin:0 auto;padding:18px 14px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
h1,h2{margin:0 0 10px}h2{font-size:18px}
.mut{color:var(--mut);font-size:14px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kp div{background:var(--bg);border-radius:12px;padding:12px;text-align:center}
.kp b{display:block;font-size:28px;line-height:1.1}.kp span{font-size:13px;color:var(--mut)}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
input{width:100%;padding:11px 12px;border:1px solid #cfd2da;border-radius:10px;background:#fff}
input:focus,button:focus-visible{outline:3px solid #c8000033;border-color:var(--r)}
.btn{background:var(--r);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--r2)}.btn[disabled]{opacity:.55;cursor:wait}
a.btn{text-decoration:none;display:inline-block}.btn.o{background:#fff;color:var(--ink);border:1px solid #cfd2da}.btn.o:hover{background:var(--bg)}
.btn.d{background:#fff;color:var(--er);border:1px solid #e6b8b4}
.btn.sm{padding:7px 11px;font-size:14px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}@media(max-width:620px){.g2{grid-template-columns:1fr}.kp b{font-size:24px}}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.pill.ok{background:#dff5ec;color:var(--ok)}.pill.no{background:#fbe3e1;color:var(--er)}.pill.wt{background:#fff1cf;color:#8a5a00}
.vd{border-top:1px solid var(--line);padding:12px 0}.vd:first-child{border-top:0}
.vd h3{margin:0;font-size:16px}.vd small{color:var(--mut)}
.msg{padding:10px 12px;border-radius:10px;margin:10px 0;font-size:14px}.msg.er{background:#fbe3e1;color:var(--er)}.msg.ok{background:#dff5ec;color:var(--ok)}
.qty{display:flex;align-items:center;gap:8px}.qty input{width:90px;text-align:center}.qty button{width:42px;height:42px;border-radius:10px;border:1px solid #cfd2da;background:#fff;font-size:22px;cursor:pointer}
.ov{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:14px;z-index:9}.ov.on{display:flex}
.md{background:#fff;border-radius:16px;max-width:460px;width:100%;max-height:92vh;overflow:auto;padding:18px}
.md img{display:block;margin:10px auto;width:220px;height:220px}
.cred{background:var(--bg);border-radius:10px;padding:12px;font-family:ui-monospace,Menlo,monospace;font-size:14px;word-break:break-all;white-space:pre-wrap}
.login{max-width:400px;margin:8vh auto 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div id="app"></div>
<div class="ov" id="ov" role="dialog" aria-modal="true"><div class="md" id="md"></div></div>
<script>
const SU='https://qrmwgqkiwoenlkfzjazs.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFybXdncWtpd29lbmxrZnpqYXpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4MDc3OTIsImV4cCI6MjEwNjM4Mzc5Mn0.lhgkQS_WcB55uG0SKk0ngQgpc9oruFRt2H2D8orjNnc';
const SLUG=(location.pathname.match(/^\/([a-z0-9-]+)\/supervisor\/?$/i)||[])[1]||'';
const sb=supabase.createClient(SU,KEY,{auth:{storageKey:'sb-sup-'+(SLUG||'x')+'-auth-token'}});
const $=id=>document.getElementById(id),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fd=t=>{try{return new Date(t).toLocaleDateString('pt-BR')}catch(e){return ''}};
const ST={pago:['Pago','ok'],aguardando_pagamento:['Aguardando Pix','wt'],cancelado:['Cancelado','no'],expirado:['Expirado','no'],falha_valor:['Valor divergente','no']};
let D=null,poll=null,busy=false;
const base=location.origin;
function app(h){$('app').innerHTML=h}
function modal(h){$('md').innerHTML=h;$('ov').classList.add('on')}
function fecha(){$('ov').classList.remove('on');clearInterval(poll);poll=null}
$('ov').addEventListener('click',e=>{if(e.target===$('ov'))fecha()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')fecha()});
function toastErr(t,el){const e=document.createElement('div');e.className='msg er';e.setAttribute('role','alert');e.textContent=t;(el||$('app')).prepend(e);setTimeout(()=>e.remove(),7000)}
async function rpc(n,a){const r=await sb.rpc(n,a||{});if(r.error){const m=r.error.message||'Erro';throw new Error(/JWT|not authenticated|permission denied/i.test(m)?'Sua sessão expirou. Entre de novo.':m)}return r.data}

function loginView(msg){
  app(`<div class="wrap"><div class="card login"><h1>Painel do supervisor</h1><p class="mut">Entre com o e-mail e a senha do seu cadastro.</p>${msg?`<div class="msg er" role="alert">${esc(msg)}</div>`:''}
  <form id="lf" autocomplete="on"><label for="em">E-mail</label><input id="em" type="email" autocomplete="username" required><label for="se">Senha</label><input id="se" type="password" autocomplete="current-password" required>
  <div style="margin-top:16px"><button class="btn" id="lb" style="width:100%">Entrar</button></div></form></div></div>`);
  $('lf').onsubmit=async e=>{e.preventDefault();const b=$('lb');b.disabled=true;b.textContent='Entrando…';
    const{error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('se').value});
    if(error){loginView('E-mail ou senha incorretos.');return}await boot()}
}
async function boot(){
  const{data:{session}}=await sb.auth.getSession();if(!session)return loginView();
  try{D=await rpc('sup_painel')}catch(e){const m=String(e.message);await sb.auth.signOut();return loginView(/restrito/i.test(m)?'Este login não tem acesso de supervisor.':m)}
  if(SLUG&&D.slug!==SLUG){await sb.auth.signOut();return loginView('Este login não pertence a este painel. Use o endereço do seu próprio painel.')}
  view();try{const p=await rpc('sup_pacote_pendente');if(p)pixView(p,true)}catch(e){}
}
function view(){
  const v=D.vagas,pr=Number(D.preco||0);
  app(`<div class="top"><div><b>${esc(D.nome)}</b><br><small>Painel do supervisor</small></div><span class="sp"></span><a class="btn o sm" href="${base}/${esc(D.slug)}/admin">Meu painel de vendedor</a><a class="btn o sm" href="${base}/${esc(D.slug)}" target="_blank" rel="noopener">Meu site</a><button class="btn o sm" id="so">Sair</button></div>
  <div class="wrap"><div class="card"><h2>Suas vagas de vendedor</h2><div class="kp"><div><b>${v.disponiveis}</b><span>livres</span></div><div><b>${v.usadas}</b><span>em uso</span></div><div><b>${Number(v.compradas)+Number(v.manuais)}</b><span>no total</span></div></div>
  <p class="mut" style="margin:12px 0 0">Cada vendedor criado usa uma vaga. Ao apagar um vendedor, a vaga volta para você.</p></div>
  <div class="card"><h2>Comprar vendedores</h2>${pr>0?`<p class="mut">${brl(pr)} por vendedor, pago por Pix. As vagas entram aqui assim que o pagamento é confirmado.</p>
  <label for="q">Quantos vendedores?</label><div class="row"><div class="qty"><button type="button" id="qm" aria-label="Menos">−</button><input id="q" type="number" min="1" max="500" value="1" inputmode="numeric"><button type="button" id="qp" aria-label="Mais">+</button></div><b id="tot" style="font-size:20px"></b><button class="btn" id="cb">Gerar Pix</button></div>`:`<p class="mut">O valor por vendedor ainda não foi definido. Fale com o administrador.</p>`}</div>
  <div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Meus vendedores (${D.vendedores.length})</h2><button class="btn" id="nv">+ Criar vendedor</button></div>
  ${D.vendedores.length?D.vendedores.map(x=>`<div class="vd"><div class="row" style="justify-content:space-between"><div><h3>${esc(x.nome)} ${x.suspenso?'<span class="pill no">suspenso</span>':'<span class="pill ok">ativo</span>'}</h3><small>/${esc(x.slug)} · ${esc(x.email||'')} · ${esc(x.whatsapp||'')}</small></div></div>
  <div class="row" style="margin-top:8px"><a class="btn o sm" href="${base}/${esc(x.slug)}" target="_blank" rel="noopener">Ver site</a><button class="btn o sm" data-a="ed" data-i="${esc(x.id)}">Editar</button><button class="btn o sm" data-a="sn" data-i="${esc(x.id)}">Nova senha</button><button class="btn o sm" data-a="su" data-i="${esc(x.id)}">${x.suspenso?'Reativar':'Suspender'}</button><button class="btn d sm" data-a="ap" data-i="${esc(x.id)}">Apagar</button></div></div>`).join(''):'<p class="mut">Você ainda não criou vendedores.</p>'}</div>
  ${D.pacotes.length?`<div class="card"><h2>Compras de vagas</h2>${D.pacotes.map(p=>{const s=ST[p.status]||[p.status,'wt'];return `<div class="vd row" style="justify-content:space-between"><span>${p.quantidade} vendedor(es) · ${brl(p.total)} <small>${fd(p.criado)}</small></span><span class="pill ${s[1]}">${s[0]}</span></div>`}).join('')}</div>`:''}</div>`);
  $('so').onclick=async()=>{await sb.auth.signOut();loginView()};
  $('nv').onclick=novoForm;
  if(pr>0){const q=$('q'),up=()=>{let n=parseInt(q.value,10);if(!(n>=1))n=1;if(n>500)n=500;$('tot').textContent=brl(n*pr)};q.oninput=up;$('qm').onclick=()=>{q.value=Math.max(1,(parseInt(q.value,10)||1)-1);up()};$('qp').onclick=()=>{q.value=Math.min(500,(parseInt(q.value,10)||0)+1);up()};up();
    $('cb').onclick=async()=>{const n=parseInt(q.value,10);if(!(n>=1&&n<=500))return toastErr('Escolha de 1 a 500 vendedores.');const b=$('cb');b.disabled=true;b.textContent='Gerando…';try{const p=await rpc('sup_comprar',{p_qtd:n});pixView(p)}catch(e){toastErr(e.message)}b.disabled=false;b.textContent='Gerar Pix'}}
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>acao(b.dataset.a,b.dataset.i));
}
function pixView(p,retomada){
  modal(`<h2>Pagar por Pix</h2><p class="mut">${p.quantidade} vendedor(es) · <b>${brl(p.valor)}</b>${retomada?' · pagamento em andamento':''}</p>${p.qr64?`<img alt="QR Code do Pix" src="data:image/png;base64,${esc(p.qr64)}">`:''}
  <label for="cc">Pix copia e cola</label><div class="row" style="flex-wrap:nowrap"><input id="cc" readonly value="${esc(p.qr||'')}"><button class="btn sm" id="cp">Copiar</button></div>
  <p class="mut" id="ps" style="margin-top:12px">Aguardando a confirmação do pagamento…</p><div class="row"><button class="btn o" id="vf">Já paguei: verificar</button><button class="btn o" id="fc">Fechar</button></div>`);
  $('cp').onclick=()=>{navigator.clipboard.writeText(p.qr||'').then(()=>{$('cp').textContent='Copiado ✓'},()=>{$('cc').select()})};
  $('fc').onclick=fecha;
  const chk=async()=>{try{const r=await rpc('sup_verificar',{p_token:p.token});if(r.status==='pago'){clearInterval(poll);D=await rpc('sup_painel');view();modal(`<h2>Pagamento confirmado ✓</h2><p>As vagas já estão disponíveis na sua conta.</p><button class="btn" onclick="fecha()">Continuar</button>`)}
    else if(['cancelado','expirado','falha_valor'].includes(r.status)){clearInterval(poll);$('ps').textContent=r.status==='falha_valor'?'O valor pago não confere com o pedido. Fale com o administrador.':'Este Pix expirou ou foi cancelado. Gere um novo.'}}catch(e){}};
  $('vf').onclick=chk;clearInterval(poll);poll=setInterval(chk,4000);
}
function novoForm(){
  if(D.vagas.disponiveis<1)return modal(`<h2>Sem vagas livres</h2><p>Compre mais vendedores para poder criar um novo.</p><button class="btn" onclick="fecha()">Entendi</button>`);
  modal(`<h2>Criar vendedor</h2><form id="nf" autocomplete="off"><label for="n_n">Nome</label><input id="n_n" required><label for="n_e">E-mail de login</label><input id="n_e" type="email" required><label for="n_w">WhatsApp (com DDD)</label><input id="n_w" inputmode="tel" placeholder="(68) 99999-9999" required>
  <label for="n_s">Endereço do site (opcional)</label><input id="n_s" placeholder="ex.: maria-motos"><label for="n_p">Senha (opcional, mínimo 8)</label><input id="n_p" placeholder="em branco = gerar automaticamente"><div id="nm"></div><div class="row" style="margin-top:14px"><button class="btn" id="nb">Criar</button><button type="button" class="btn o" onclick="fecha()">Cancelar</button></div></form>`);
  $('nf').onsubmit=async e=>{e.preventDefault();const b=$('nb');b.disabled=true;b.textContent='Criando…';
    try{const r=await rpc('sup_criar_vendedor',{p:{nome:$('n_n').value,email:$('n_e').value,whatsapp:$('n_w').value,slug:$('n_s').value,senha:$('n_p').value}});D=await rpc('sup_painel');view();credView(r)}
    catch(er){$('nm').innerHTML=`<div class="msg er" role="alert">${esc(er.message)}</div>`;b.disabled=false;b.textContent='Criar'}}
}
function credView(r){
  const txt=`Seu acesso ao site de vendas\nSite: ${base}/${r.slug}\nPainel: ${base}/${r.slug}/admin\nLogin: ${r.email}\nSenha: ${r.senha}`;
  modal(`<h2>Vendedor criado ✓</h2><p class="mut">Anote a senha agora: ela é mostrada só aqui. Você pode gerar outra depois em “Nova senha”.</p><div class="cred">${esc(txt)}</div><div class="row" style="margin-top:12px"><button class="btn" id="cc2">Copiar</button><a class="btn o" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(txt)}">Enviar por WhatsApp</a><button class="btn o" onclick="fecha()">Fechar</button></div>`);
  $('cc2').onclick=()=>navigator.clipboard.writeText(txt).then(()=>{$('cc2').textContent='Copiado ✓'},()=>{});
}
async function acao(a,id){
  const x=D.vendedores.find(v=>v.id===id);if(!x)return;
  try{
    if(a==='ed'){modal(`<h2>Editar vendedor</h2><form id="ef"><label for="e_n">Nome</label><input id="e_n" value="${esc(x.nome)}" required><label for="e_w">WhatsApp (com DDD)</label><input id="e_w" inputmode="tel" value="${esc(x.whatsapp||'')}" required><div id="em2"></div><div class="row" style="margin-top:14px"><button class="btn" id="eb">Salvar</button><button type="button" class="btn o" onclick="fecha()">Cancelar</button></div></form>`);
      $('ef').onsubmit=async e=>{e.preventDefault();const b=$('eb');b.disabled=true;try{await rpc('sup_editar_vendedor',{p_id:id,p:{nome:$('e_n').value,whatsapp:$('e_w').value}});D=await rpc('sup_painel');fecha();view()}catch(er){$('em2').innerHTML=`<div class="msg er">${esc(er.message)}</div>`;b.disabled=false}}}
    else if(a==='su'){const s=!x.suspenso;if(!confirm(s?`Suspender o site de ${x.nome}? Ele deixa de aparecer para os clientes até você reativar.`:`Reativar o site de ${x.nome}?`))return;await rpc('sup_editar_vendedor',{p_id:id,p:{suspenso:s}});D=await rpc('sup_painel');view()}
    else if(a==='sn'){if(!confirm(`Gerar uma nova senha para ${x.nome}? A senha atual deixa de funcionar.`))return;const s=await rpc('sup_senha_vendedor',{p_id:id});credView({slug:x.slug,email:x.email,senha:s})}
    else if(a==='ap'){const t=prompt(`Apagar ${x.nome} remove o site, as motos e os dados de clientes dele, e não dá para desfazer.\n\nPara confirmar, digite o endereço: ${x.slug}`);if(t===null)return;const m=await rpc('sup_excluir_vendedor',{p_id:id,p_confirma:t});D=await rpc('sup_painel');view();const k=document.createElement('div');k.className='msg ok';k.setAttribute('role','status');k.textContent=m;$('app').querySelector('.wrap').prepend(k);setTimeout(()=>k.remove(),6000)}
  }catch(e){toastErr(e.message)}
}
boot();
</script></body></html>
