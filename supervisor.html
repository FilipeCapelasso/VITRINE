<style>
:root{--r:#d0021b;--r2:#a3000f;--ink:#15161a;--mut:#5d6270;--line:#e3e5ea;--bg:#f2f3f6;--card:#fff;--ok:#0d7d4f;--okb:#e2f5ec;--er:#b3261e;--erb:#fbe5e3;--wt:#8a5a00;--wtb:#fff3d1;--rad:18px}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit;color:inherit}
a{color:inherit}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.top-i{max-width:1120px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand .lg{width:44px;height:44px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;flex:none}
.brand .lg img{max-width:100%;max-height:100%;object-fit:contain}
.brand b{display:block;font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand small{color:var(--mut);font-size:13px}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.wrap{max-width:1120px;margin:0 auto;padding:22px 18px 70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:20px;margin:0 0 16px}
h1{font-size:clamp(26px,3.2vw,36px);line-height:1.1;margin:0 0 6px;letter-spacing:-.02em}
h2{font-size:19px;margin:0 0 4px}
.mut{color:var(--mut);font-size:14px;margin:0}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 5px}
input{width:100%;padding:11px 13px;border:1px solid #cdd1d9;border-radius:11px;background:#fff}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #d0021b40;outline-offset:2px;border-color:var(--r)}
.btn{background:var(--r);color:#fff;border:0;border-radius:11px;padding:11px 18px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--r2)}.btn[disabled]{opacity:.55;cursor:wait}
.btn.o{background:#fff;color:var(--ink);border:1px solid #cdd1d9}.btn.o:hover{background:var(--bg)}
.btn.d{background:#fff;color:var(--er);border:1px solid #ecc2be}.btn.d:hover{background:var(--erb)}
.btn.wa{background:#128c4a}.btn.wa:hover{background:#0d6e39}
.btn.sm{padding:7px 12px;font-size:14px;font-weight:600;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;vertical-align:middle}
.pill.ok{background:var(--okb);color:var(--ok)}.pill.no{background:var(--erb);color:var(--er)}.pill.wt{background:var(--wtb);color:var(--wt)}
.msg{padding:11px 13px;border-radius:11px;margin:10px 0;font-size:14px}.msg.er{background:var(--erb);color:var(--er)}.msg.ok{background:var(--okb);color:var(--ok)}
/* vagas: cada quadrado é uma vaga */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,1fr);gap:22px;align-items:center}
.seats{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 12px;max-width:560px}
.seats i{width:20px;height:20px;border-radius:6px;border:2px solid #cfd3db;background:#fff}
.seats i.u{background:var(--r);border-color:var(--r)}
.seats em{font-style:normal;color:var(--mut);font-size:13px;align-self:center;margin-left:4px}
.lgd{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mut)}.lgd span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:2px solid #cfd3db}.lgd .u::before{background:var(--r);border-color:var(--r)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.nums div{padding:14px 12px;text-align:center}.nums div+div{border-left:1px solid var(--line)}
.nums b{display:block;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}.nums span{font-size:13px;color:var(--mut)}
.nums .lv b{color:var(--ok)}
.hero .cta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
/* Pix pendente */
.pend{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--wtb);border:1px solid #f1d58a;border-radius:var(--rad);padding:14px 18px;margin:0 0 16px}
.pend b{color:var(--wt)}
/* compra */
.buy{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:end}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chips button{border:1px solid #cdd1d9;background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.qty{display:flex;align-items:center;gap:6px;margin-top:10px}.qty input{width:96px;text-align:center;font-weight:700}
.qty button{width:44px;height:44px;border-radius:11px;border:1px solid #cdd1d9;background:#fff;font-size:22px;cursor:pointer}
.tot{text-align:right}.tot small{display:block;color:var(--mut);font-size:13px}.tot b{display:block;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums;margin-bottom:10px}
/* vendedores */
.vh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.vh input{max-width:320px}
.vl{display:grid;gap:10px}
.vd{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:14px}
.vd.sus{background:#fafafb}.vd.sus .av{background:#9aa0ab}
.av{width:42px;height:42px;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800}
.vd h3{margin:0;font-size:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.vd small{color:var(--mut);font-size:13px;word-break:break-all}
.vd .ac{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.emp{text-align:center;padding:30px 10px;color:var(--mut)}
.hist{width:100%;border-collapse:collapse;font-size:14px}.hist td,.hist th{padding:10px 8px;border-top:1px solid var(--line);text-align:left}.hist th{color:var(--mut);font-weight:600;border-top:0}.hist td:last-child,.hist th:last-child{text-align:right}
/* modal */
.ov{position:fixed;inset:0;background:#0b0c10a8;display:none;align-items:center;justify-content:center;padding:14px;z-index:9}.ov.on{display:flex}
.md{background:#fff;border-radius:20px;max-width:480px;width:100%;max-height:92vh;overflow:auto;padding:22px}
.md img{display:block;margin:12px auto;width:230px;height:230px;border-radius:12px;border:1px solid var(--line)}
.cred{background:var(--bg);border-radius:11px;padding:12px;font-family:ui-monospace,Menlo,monospace;font-size:14px;word-break:break-all;white-space:pre-wrap}
.login{max-width:420px;margin:9vh auto 0}
.login .lgx{width:52px;height:52px;border-radius:14px;background:var(--r);display:grid;place-items:center;margin-bottom:14px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}@keyframes sp{to{transform:rotate(360deg)}}
#mensal h2{margin-bottom:4px}.sm{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}.sm:first-of-type{margin-top:8px}.sm small{display:block;color:var(--mut);font-size:13px;margin-top:2px}.sm .ac2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mb{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px dashed var(--line)}.mb span{font-size:14px;color:var(--mut);flex:1 1 240px}.mb b{color:var(--ink)}
@media(max-width:820px){.hero,.buy{grid-template-columns:1fr}.tot{text-align:left}.vd{grid-template-columns:auto minmax(0,1fr)}.vd .ac{grid-column:1/-1;justify-content:flex-start}}
@media(max-width:520px){.nav .btn{flex:1}.nums b{font-size:24px}.seats i{width:17px;height:17px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>

$('ov').addEventListener('click',e=>{if(e.target===$('ov'))fecha()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')fecha()});
function toastErr(t,el){const e=document.createElement('div');e.className='msg er';e.setAttribute('role','alert');e.textContent=t;(el||$('app')).prepend(e);setTimeout(()=>e.remove(),7000)}
function okMsg(m){const k=document.createElement('div');k.className='msg ok';k.setAttribute('role','status');k.textContent=m;const w=$('app').querySelector('.wrap');(w||$('app')).prepend(k);setTimeout(()=>k.remove(),6000)}
async function rpc(n,a){const r=await sb.rpc(n,a||{});if(r.error){const m=r.error.message||'Erro';throw new Error(/JWT|not authenticated|permission denied/i.test(m)?'Sua sessão expirou. Entre de novo.':m)}return r.data}

function loginView(msg){
  app(`<div class="wrap"><div class="card login"><div class="lgx" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/><path d="M9 12l2 2 4-4"/></svg></div><h1>Painel do supervisor</h1><p class="mut">Entre com o e-mail e a senha do seu cadastro.</p>${msg?`<div class="msg er" role="alert">${esc(msg)}</div>`:''}
  <form id="lf" autocomplete="on"><label for="em">E-mail</label><input id="em" type="email" autocomplete="username" required><label for="se">Senha</label><input id="se" type="password" autocomplete="current-password" required>
  <div style="margin-top:18px"><button class="btn" id="lb" style="width:100%">Entrar</button></div></form></div></div>`);
  $('lf').onsubmit=async e=>{e.preventDefault();const b=$('lb');b.disabled=true;b.innerHTML='<span class="spin"></span> Entrando…';
    const{error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('se').value});
    if(error){loginView('E-mail ou senha incorretos.');return}await boot()}
}
async function boot(){
  const{data:{session}}=await sb.auth.getSession();if(!session)return loginView();
  try{D=await rpc('sup_painel')}catch(e){const m=String(e.message);await sb.auth.signOut();return loginView(/restrito/i.test(m)?'Este login não tem acesso de supervisor.':m)}
  if(SLUG&&D.slug!==SLUG){await sb.auth.signOut();return loginView('Este login não pertence a este painel. Use o endereço do seu próprio painel.')}
  try{PEND=await rpc('sup_pacote_pendente')}catch(e){PEND=null}await smLoad();view();if(PEND)pixView(PEND,true);
  document.addEventListener('visibilitychange',async()=>{if(document.hidden||!PEND)return;try{const r=await rpc('sup_verificar',{p_token:PEND.token});if(r.status!=='aguardando_pagamento'){PEND=null;D=await rpc('sup_painel');if(!$('ov').classList.contains('on'))view()}}catch(e){}})
}
let QF='',PEND=null,QN=1;
function seats(v){const tot=Number(v.compradas)+Number(v.manuais),us=Number(v.usadas),max=60,n=Math.min(tot,max);
  if(!tot)return '<p class="mut" style="margin:14px 0">Você ainda não tem vagas. Compre abaixo para começar a criar vendedores.</p>';
  let h='';for(let k=0;k<n;k++)h+=`<i class="${k<us?'u':''}"></i>`;if(tot>max)h+=`<em>+${tot-max}</em>`;
  return `<div class="seats" role="img" aria-label="${us} de ${tot} vagas em uso">${h}</div><div class="lgd"><span class="u">em uso</span><span>livre</span></div>`}
function vCards(){const q=QF.toLowerCase().trim(),L=D.vendedores.filter(x=>!q||[x.nome,x.slug,x.email,x.whatsapp].join(' ').toLowerCase().includes(q));
  if(!D.vendedores.length)return `<div class="emp"><b>Nenhum vendedor ainda.</b><br>${D.vagas.disponiveis>0?'Toque em “Criar vendedor” para usar uma das suas vagas.':'Compre vagas para criar o primeiro.'}</div>`;
  if(!L.length)return '<div class="emp">Nenhum vendedor encontrado.</div>';
  return L.map(x=>`<div class="vd${x.suspenso?' sus':''}"><div class="av" aria-hidden="true">${esc((x.nome||'?').trim().charAt(0).toUpperCase())}</div><div><h3>${esc(x.nome)} ${x.suspenso?'<span class="pill no">suspenso</span>':'<span class="pill ok">no ar</span>'}</h3><small>/${esc(x.slug)} · ${esc(x.email||'')} · ${Number(x.motos||0)} moto(s)</small></div>
  <div class="ac"><a class="btn o sm" href="${base}/${esc(x.slug)}" target="_blank" rel="noopener">Ver site</a><button class="btn o sm" data-a="lk" data-i="${esc(x.id)}">Copiar link</button>${x.whatsapp?`<button class="btn o sm" data-a="wa" data-i="${esc(x.id)}">Enviar acesso</button>`:''}<button class="btn o sm" data-a="ed" data-i="${esc(x.id)}">Editar</button><button class="btn o sm" data-a="sn" data-i="${esc(x.id)}">Nova senha</button><button class="btn o sm" data-a="su" data-i="${esc(x.id)}">${x.suspenso?'Reativar':'Suspender'}</button><button class="btn d sm" data-a="ap" data-i="${esc(x.id)}">Apagar</button></div></div>`).join('')}
function liga(){document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>acao(b.dataset.a,b.dataset.i))}
function smH(){const L=(SM&&SM.assinaturas)||[];if(!L.length)return'';
  const ST2={autorizada:['Ativa','ok'],pendente:['Aguardando confirmação','wt'],pausada:['Pausada: cartão recusado','no'],cancelada:['Cancelada','wt']};
  return `<section class="card" id="mensal"><h2>Assinaturas mensais no cartão</h2><p class="mut">Cobradas todo mês, sozinhas. Cada pagamento mantém as vagas ativas por mais 31 dias.</p>${L.map(a=>{const st=ST2[a.status]||[a.status,'wt'],ab=['pendente','autorizada','pausada'].includes(a.status);
    const info=a.status==='autorizada'&&a.proximo?'Próxima cobrança em '+fd(a.proximo):a.valido_ate?'Vagas ativas até '+fd(a.valido_ate):'Falta confirmar no Mercado Pago';
    return `<div class="sm"><div><b>${a.quantidade} vaga${a.quantidade>1?'s':''} · ${brl(a.valor)}/mês</b><small>${info}</small></div><div class="ac2"><span class="pill ${st[1]}">${st[0]}</span>${a.status==='pendente'&&smOk(a.init_point)?`<a class="btn sm" href="${esc(a.init_point)}" target="_blank" rel="noopener">Continuar no Mercado Pago</a>`:''}${ab?`<button class="btn o sm" data-sm="${esc(a.id)}">Cancelar</button>`:''}</div></div>`}).join('')}</section>`}
function smModal(r,n){
  modal(`<h2>Confirme no Mercado Pago</h2><p class="mut">${n} vaga${n>1?'s':''} · <b>${brl(n*Number(D.preco||0))}</b> por mês no cartão</p><p style="margin:12px 0">Toque no botão abaixo. No Mercado Pago, <b>entre na sua conta ou informe o cartão</b> e confirme a assinatura. Depois volte aqui: esta tela avisa sozinha.</p>
  <div class="row"><a class="btn" href="${esc(r.init_point)}" target="_blank" rel="noopener">Abrir o Mercado Pago</a><button class="btn o" id="fc">Fechar</button></div><p class="mut" id="ps" style="margin-top:12px">⏳ Aguardando a confirmação…</p>`);
  $('fc').onclick=async()=>{fecha();await smLoad();view()};
  clearInterval(poll);let t=0;poll=setInterval(async()=>{if(++t>450){clearInterval(poll);return}
    try{const q=await rpc('sup_mensal_verificar');SM=q;const a=(q.assinaturas||[]).find(x=>x.id===r.id);
      if(a&&a.status==='autorizada'){clearInterval(poll);D=await rpc('sup_painel');view();modal(`<h2>Assinatura ativada! 🎉</h2><p style="margin:10px 0">${n} vaga${n>1?'s':''} por ${brl(a.valor)} ao mês, no cartão. ${a.proximo?'Próxima cobrança em <b>'+fd(a.proximo)+'</b>.':'Você será avisado a cada pagamento.'}</p><div class="row"><button class="btn" id="fc">Fechar</button></div>`);$('fc').onclick=fecha}}
    catch(e){}},4000)}
function view(){
  const v=D.vagas,pr=Number(D.preco||0),tot=Number(v.compradas)+Number(v.manuais),loc=[D.local,D.uf].filter(Boolean).join(' · ');
  app(`<header class="top"><div class="top-i"><div class="brand"><div class="lg">${D.logo?`<img src="${esc(D.logo)}" alt="">`:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#d0021b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/><path d="M9 12l2 2 4-4"/></svg>`}</div><div style="min-width:0"><b>${esc(D.nome)}</b><small>Supervisor${loc?' · '+esc(loc):''}</small></div></div>
  <nav class="nav"><a class="btn o sm" href="${base}/${esc(D.slug)}/admin">Meu painel de vendedor</a><a class="btn o sm" href="${base}/${esc(D.slug)}" target="_blank" rel="noopener">Meu site</a><button class="btn o sm" id="so">Sair</button></nav></div></header>
  <main class="wrap">
  ${PEND?`<div class="pend" role="status"><span>⏳ <b>Pix de ${brl(PEND.valor)}</b> (${PEND.quantidade} vaga${PEND.quantidade>1?'s':''}) aguardando pagamento. A confirmação é automática.</span><button class="btn sm" id="pdo">Ver Pix</button></div>`:''}
  <section class="card"><div class="hero"><div><h1>Suas vagas</h1><p class="mut">Cada vendedor que você cria usa uma vaga. Apagou um vendedor, a vaga volta.</p>${seats(v)}</div>
  <div><div class="nums"><div class="lv"><b>${v.disponiveis}</b><span>livres</span></div><div><b>${v.usadas}</b><span>em uso</span></div><div><b>${tot}</b><span>no total</span></div></div>
  <div class="cta"><button class="btn" id="nv"${v.disponiveis<1?' disabled title="Sem vagas livres"':''}>＋ Criar vendedor</button>${pr>0?'<a class="btn o" href="#comprar">Comprar vagas</a>':''}</div></div></div></section>
  <section class="card" id="comprar"><h2>Comprar vagas</h2>${pr>0?`<p class="mut">${brl(pr)} por vaga, pago uma vez por Pix. As vagas entram na hora em que o Mercado Pago confirma.</p>
  <div class="buy"><div><label for="q">Quantas vagas?</label><div class="chips" role="group" aria-label="Quantidades rápidas">${[1,5,10,25].map(n=>`<button type="button" data-q="${n}">${n}</button>`).join('')}</div>
  <div class="qty"><button type="button" id="qm" aria-label="Menos uma">−</button><input id="q" type="number" min="1" max="500" value="${QN}" inputmode="numeric" aria-label="Quantidade de vagas"><button type="button" id="qp" aria-label="Mais uma">+</button></div></div>
  <div class="tot"><small>Total</small><b id="tot"></b><button class="btn" id="cb">Gerar Pix</button></div></div>
  <div class="mb"><span id="mt"></span><button class="btn o" id="mbt">💳 Assinar mensal no cartão</button></div>`:`<p class="mut">O valor por vaga ainda não foi definido. Fale com o administrador.</p>`}</section>
  ${smH()}
  <section class="card"><div class="vh"><div><h2>Meus vendedores</h2><p class="mut">${D.vendedores.length} vendedor(es)</p></div>${D.vendedores.length>3?`<input id="vq" type="search" placeholder="Buscar vendedor" value="${esc(QF)}" aria-label="Buscar vendedor">`:''}</div><div class="vl" id="vl">${vCards()}</div></section>
  ${D.pacotes.length?`<section class="card"><h2>Compras de vagas</h2><div style="overflow-x:auto"><table class="hist"><thead><tr><th>Data</th><th>Vagas</th><th>Valor</th><th>Situação</th></tr></thead><tbody>${D.pacotes.map(p=>{const s=ST[p.status]||[p.status,'wt'];return `<tr><td>${fd(p.criado)}</td><td>${p.quantidade}</td><td>${brl(p.total)}</td><td><span class="pill ${s[1]}">${s[0]}</span></td></tr>`}).join('')}</tbody></table></div></section>`:''}
  </main>`);
  $('so').onclick=async()=>{await sb.auth.signOut();loginView()};
  $('nv').onclick=novoForm;if($('pdo'))$('pdo').onclick=()=>pixView(PEND,true);
  if($('vq'))$('vq').oninput=e=>{QF=e.target.value;$('vl').innerHTML=vCards();liga()};
  if(pr>0){const q=$('q'),up=()=>{let n=parseInt(q.value,10);if(!(n>=1))n=1;if(n>500)n=500;QN=n;$('tot').textContent=brl(n*pr);$('mt').innerHTML='Ou assine: <b>'+n+' vaga'+(n>1?'s':'')+' por '+brl(n*pr)+' ao mês</b>, cobrado sozinho no cartão. Cancele quando quiser.';document.querySelectorAll('[data-q]').forEach(b=>b.classList.toggle('on',+b.dataset.q===n))};
    q.oninput=up;$('qm').onclick=()=>{q.value=Math.max(1,(parseInt(q.value,10)||1)-1);up()};$('qp').onclick=()=>{q.value=Math.min(500,(parseInt(q.value,10)||0)+1);up()};
    document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{q.value=b.dataset.q;up()});up();
    $('cb').onclick=async()=>{const n=parseInt(q.value,10);if(!(n>=1&&n<=500))return toastErr('Escolha de 1 a 500 vagas.');if(PEND&&!confirm('Você já tem um Pix aguardando pagamento. Gerar outro mesmo assim?'))return;const b=$('cb');b.disabled=true;b.innerHTML='<span class="spin"></span> Gerando…';try{const p=await rpc('sup_comprar',{p_qtd:n});PEND=p;pixView(p);D=await rpc('sup_painel');view()}catch(e){toastErr(e.message)}const b2=$('cb');if(b2){b2.disabled=false;b2.textContent='Gerar Pix'}}
    $('mbt').onclick=async()=>{const n=parseInt(q.value,10);if(!(n>=1&&n<=500))return toastErr('Escolha de 1 a 500 vagas.');const b=$('mbt');b.disabled=true;b.innerHTML='<span class="spin"></span> Preparando…';
      try{const r=await rpc('sup_mensal_criar',{p_qtd:n});if(!smOk(r.init_point))throw new Error('Link de pagamento indisponível. Tente de novo.');await smLoad();smModal(r,n)}catch(e){toastErr(e.message)}const b3=$('mbt');if(b3){b3.disabled=false;b3.textContent='💳 Assinar mensal no cartão'}}}
  document.querySelectorAll('[data-sm]').forEach(b=>b.onclick=async()=>{if(!confirm('Cancelar esta assinatura mensal?\n\nAs vagas continuam até o fim do período já pago.'))return;b.disabled=true;
    try{SM=await rpc('sup_mensal_cancelar',{p_id:b.dataset.sm});D=await rpc('sup_painel');view();okMsg('Assinatura cancelada. As vagas seguem até o fim do período pago.')}catch(e){b.disabled=false;toastErr(e.message)}});
  liga();
}
function pixView(p,retomada){
  modal(`<h2>Pagar por Pix</h2><p class="mut">${p.quantidade} vendedor(es) · <b>${brl(p.valor)}</b>${retomada?' · pagamento em andamento':''}</p>${p.qr64?`<img alt="QR Code do Pix" src="data:image/png;base64,${esc(p.qr64)}">`:''}
  <label for="cc">Pix copia e cola</label><div class="row" style="flex-wrap:nowrap"><input id="cc" readonly value="${esc(p.qr||'')}"><button class="btn sm" id="cp">Copiar</button></div>
  <p class="mut" id="ps" style="margin-top:12px">Aguardando a confirmação do pagamento…</p><div class="row"><button class="btn o" id="vf">Já paguei: verificar</button><button class="btn o" id="fc">Fechar</button></div>`);
  $('cp').onclick=()=>{navigator.clipboard.writeText(p.qr||'').then(()=>{$('cp').textContent='Copiado ✓'},()=>{$('cc').select()})};
  $('fc').onclick=fecha;
  const chk=async()=>{try{const r=await rpc('sup_verificar',{p_token:p.token});if(r.status==='pago'){clearInterval(poll);PEND=null;D=await rpc('sup_painel');view();modal(`<h2>Pagamento confirmado ✓</h2><p>As vagas já estão disponíveis na sua conta.</p><button class="btn" onclick="fecha()">Continuar</button>`)}
    else if(['cancelado','expirado','falha_valor'].includes(r.status)){clearInterval(poll);PEND=null;$('ps').textContent=r.status==='falha_valor'?'O valor pago não confere com o pedido. Fale com o administrador.':'Este Pix expirou ou foi cancelado. Gere um novo.'}}catch(e){}};
  $('vf').onclick=chk;clearInterval(poll);poll=setInterval(chk,4000);
}
function novoForm(){
  if(D.vagas.disponiveis<1)return modal(`<h2>Sem vagas livres</h2><p>Compre mais vendedores para poder criar um novo.</p><button class="btn" onclick="fecha()">Entendi</button>`);
  modal(`<h2>Criar vendedor</h2><form id="nf" autocomplete="off"><label for="n_n">Nome</label><input id="n_n" required><label for="n_e">E-mail de login</label><input id="n_e" type="email" required><label for="n_w">WhatsApp (com DDD)</label><input id="n_w" inputmode="tel" placeholder="(68) 99999-9999" required>
  <label for="n_s">Endereço do site (opcional)</label><input id="n_s" placeholder="ex.: maria-motos"><label for="n_p">Senha (opcional, mínimo 8)</label><input id="n_p" placeholder="em branco = gerar automaticamente"><div id="nm"></div><div class="row" style="margin-top:14px"><button class="btn" id="nb">Criar</button><button type="button" class="btn o" onclick="fecha()">Cancelar</button></div></form>`);
  $('nf').onsubmit=async e=>{e.preventDefault();const b=$('nb');b.disabled=true;b.textContent='Criando…';
    try{const r=await rpc('sup_criar_vendedor',{p:{nome:$('n_n').value,email:$('n_e').value,whatsapp:$('n_w').value,slug:$('n_s').value,senha:$('n_p').value}});D=await rpc('sup_painel');view();credView(r)}
    catch(er){$('nm').innerHTML=`<div class="msg er" role="alert">${esc(er.message)}</div>`;b.disabled=false;b.textContent='Criar'}}
}
function credView(r){
  const txt=`Seu acesso ao site de vendas\nSite: ${base}/${r.slug}\nPainel: ${base}/${r.slug}/admin\nLogin: ${r.email}\nSenha: ${r.senha}`;
  modal(`<h2>Vendedor criado ✓</h2><p class="mut">Anote a senha agora: ela é mostrada só aqui. Você pode gerar outra depois em “Nova senha”.</p><div class="cred">${esc(txt)}</div><div class="row" style="margin-top:12px"><button class="btn" id="cc2">Copiar</button><a class="btn o" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(txt)}">Enviar por WhatsApp</a><button class="btn o" onclick="fecha()">Fechar</button></div>`);
  $('cc2').onclick=()=>navigator.clipboard.writeText(txt).then(()=>{$('cc2').textContent='Copiado ✓'},()=>{});
}
async function acao(a,id){
  const x=D.vendedores.find(v=>v.id===id);if(!x)return;
  if(a==='lk'){const u=`${base}/${x.slug}`;navigator.clipboard.writeText(u).then(()=>okMsg('Link copiado: '+u),()=>prompt('Copie o link:',u));return}
  if(a==='wa'){const t=`Olá, ${x.nome.split(' ')[0]}! Seu site de vendas Honda está no ar:\nSite: ${base}/${x.slug}\nPainel: ${base}/${x.slug}/admin\nLogin: ${x.email}\n(Use a senha que te passei. Se esqueceu, me avise que eu gero outra.)`;const n=String(x.whatsapp||'').replace(/\D/g,''),w=n.length>=10&&n.length<=11?'55'+n:n;window.open(`https://wa.me/${w}?text=${encodeURIComponent(t)}`,'_blank','noopener');return}
  try{
    if(a==='ed'){modal(`<h2>Editar vendedor</h2><form id="ef"><label for="e_n">Nome</label><input id="e_n" value="${esc(x.nome)}" required><label for="e_w">WhatsApp (com DDD)</label><input id="e_w" inputmode="tel" value="${esc(x.whatsapp||'')}" required><div id="em2"></div><div class="row" style="margin-top:14px"><button class="btn" id="eb">Salvar</button><button type="button" class="btn o" onclick="fecha()">Cancelar</button></div></form>`);
      $('ef').onsubmit=async e=>{e.preventDefault();const b=$('eb');b.disabled=true;try{await rpc('sup_editar_vendedor',{p_id:id,p:{nome:$('e_n').value,whatsapp:$('e_w').value}});D=await rpc('sup_painel');fecha();view()}catch(er){$('em2').innerHTML=`<div class="msg er">${esc(er.message)}</div>`;b.disabled=false}}}
    else if(a==='su'){const s=!x.suspenso;if(!confirm(s?`Suspender o site de ${x.nome}? Ele deixa de aparecer para os clientes até você reativar.`:`Reativar o site de ${x.nome}?`))return;await rpc('sup_editar_vendedor',{p_id:id,p:{suspenso:s}});D=await rpc('sup_painel');view()}
    else if(a==='sn'){if(!confirm(`Gerar uma nova senha para ${x.nome}? A senha atual deixa de funcionar.`))return;const s=await rpc('sup_senha_vendedor',{p_id:id});credView({slug:x.slug,email:x.email,senha:s})}
    else if(a==='ap'){const t=prompt(`Apagar ${x.nome} remove o site, as motos e os dados de clientes dele, e não dá para desfazer.\n\nPara confirmar, digite o endereço: ${x.slug}`);if(t===null)return;const m=await rpc('sup_excluir_vendedor',{p_id:id,p_confirma:t});D=await rpc('sup_painel');view();okMsg(m)}
  }catch(e){toastErr(e.message)}
}
boot();
</script></body></html>
