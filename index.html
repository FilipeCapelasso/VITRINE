.cx{max-width:1120px;margin:0 auto;padding:18px}.cx:empty{display:none}
.cx-prev{position:fixed;left:0;right:0;bottom:0;z-index:99;background:#111;color:#fff;text-align:center;font:700 13px system-ui;padding:9px 12px}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--tx);background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding:0 18px 90px}
.cover{height:110px;background:linear-gradient(135deg,var(--r),var(--ke8452f) 60%,var(--k7a0000))}
.prof{display:flex;justify-content:space-between;align-items:flex-end;margin-top:-52px}
.ava{width:104px;height:104px;border-radius:50%;border:4px solid #fff;object-fit:cover;background:#ddd;display:grid;place-items:center;font-size:40px;font-weight:800;color:#fff;background:var(--r)}
.ava.s{width:56px;height:56px;border-width:2px;font-size:20px}
.logo{height:76px;max-width:130px;object-fit:contain;background:#fff;border-radius:8px;padding:4px}
h1{margin:14px 0 2px;font-size:26px;font-weight:800}h2{font-size:22px;font-weight:800;margin:26px 0 12px}h3{margin:0;font-size:18px;font-weight:800}
.mu,small{color:var(--mu)}.row{display:flex;gap:10px;margin:14px 0}
.btn{display:block;width:100%;padding:15px;border-radius:999px;border:1px solid var(--bd);background:var(--cd);font:600 15px Inter,sans-serif;color:var(--tx);text-align:center;text-decoration:none;cursor:pointer;margin-top:10px}
.btn.red{background:var(--r);color:#fff;border-color:var(--r)}.btn.red:hover{background:var(--r2)}
.btn.wa{background:var(--g);color:#fff;border-color:var(--g)}.btn.or{background:#c96d22;color:#fff;border-color:#c96d22}
.row .btn{width:auto;margin:0;padding:13px 22px}
.card{border:1px solid var(--bd);border-radius:22px;padding:18px;margin-bottom:16px}
.card img{width:100%;height:200px;object-fit:contain;margin:8px 0 12px}
.foot{text-align:center;font-size:12px;margin-top:30px}.foot a{color:var(--mu)}
.bubble{position:fixed;right:14px;bottom:16px;background:var(--g);color:#fff;border-radius:999px;padding:8px 18px 8px 8px;display:flex;gap:10px;align-items:center;font-weight:600;text-decoration:none;box-shadow:0 6px 20px #0003;z-index:5}
.bubble .ava{width:44px;height:44px;border-width:2px;font-size:16px}
#modal{position:fixed;inset:0;background:#0007;display:none;z-index:10;overflow:auto}
.sheet{background:#fff;max-width:560px;min-height:100%;margin:0 auto;padding:16px 18px 40px}
.mh,.mt{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mh{padding-bottom:12px;border-bottom:1px solid var(--bd)}.mt{padding:6px 0;border-bottom:1px solid var(--bd);margin-bottom:12px}
.mt h2{margin:10px 0;font-size:21px}.mt b{font-size:26px;color:var(--r);padding:0 7px;cursor:pointer}.mt b:last-child{color:var(--mu)}
.mp{display:flex;gap:10px;align-items:center}.wab{background:var(--g);color:#fff;border-radius:999px;padding:12px 18px;text-decoration:none;font-weight:700}
.gal #gm{width:100%;height:260px;object-fit:contain}.th{display:flex;gap:8px;overflow:auto;padding:6px 0}
.th img{width:70px;height:54px;object-fit:contain;border:2px solid var(--bd);border-radius:8px;cursor:pointer}
.vid{width:100%;aspect-ratio:16/9;border:0;border-radius:14px;background:#000;margin-top:8px}
.desc{white-space:pre-wrap;line-height:1.6;margin-top:18px}
.pl label{display:block;padding:9px 0;font-size:18px;cursor:pointer}.pl input{accent-color:var(--r);margin-right:10px;transform:scale(1.4)}
input,select,textarea{width:100%;padding:15px;border:1px solid var(--bd);border-radius:12px;font:16px Inter,sans-serif;margin-top:10px;background:#fff}
textarea{min-height:150px}label.l{display:block;font-size:13px;color:var(--mu);margin-top:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 20px;border-radius:999px;z-index:30;display:none}
.card{position:relative}.row .btn{flex:1;padding:13px 12px}
.chips{display:flex;gap:8px;overflow:auto;padding:12px 0 6px}.chip{flex:none;padding:9px 16px;border-radius:999px;border:1px solid var(--bd);background:#fff;font:600 14px Inter,sans-serif;cursor:pointer}.chip.on{background:var(--r);color:#fff;border-color:var(--r)}
.selo{position:absolute;top:14px;right:14px;background:var(--r);color:#fff;font:700 12px Inter,sans-serif;padding:5px 11px;border-radius:999px}
.par{margin:2px 0 8px;font-size:14px}.par b{color:var(--r);font-size:18px}
.lb{position:fixed;inset:0;background:#000e;z-index:20;display:grid;place-items:center}.lb img{max-width:96vw;max-height:90vh}
.sk{height:260px;border-radius:22px;background:linear-gradient(90deg,#f0f0f0,#fafafa,#f0f0f0);margin-bottom:16px}
.stk{position:sticky;bottom:0;background:#fff;padding:10px 0 4px;margin-top:14px}#modal{overscroll-behavior:contain}
details{border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:12px 0;font-size:14px;line-height:1.5}summary{font-weight:700;cursor:pointer}
@media(min-width:720px){#modal{padding:28px 14px}.sheet{max-width:780px;min-height:0;border-radius:18px;box-shadow:0 20px 60px #0005}.gal #gm{height:330px}}
.gal{display:flex;gap:10px;align-items:center}#gmain{flex:1;min-width:0}.gal .th{flex-direction:column;width:76px;flex:none;max-height:340px;padding:0}.gal .th img{width:70px}
.vb{width:46px;height:46px;border-radius:50%;background:var(--r);color:#fff;border:0;font-size:16px;cursor:pointer;flex:none;align-self:center}

<script id="segjs">
/* ===== ENVIO SEGURO: o dado do cliente nunca se perde ===== */
const SEG_OBX='obx_v2';
function obxGet(){try{return JSON.parse(localStorage.getItem(SEG_OBX)||'[]')}catch(e){return[]}}
function obxSet(a){try{localStorage.setItem(SEG_OBX,JSON.stringify(a.slice(-40)))}catch(e){}}
/* insere; se o banco recusar uma coluna que não existe (ex.: "cor"), tira a coluna e tenta de novo (o dado principal nunca é perdido) */
async function segInsert(tab,row){
  const r={...row};
  for(let i=0;i<8;i++){
    let q;try{q=await sb.from(tab).insert(r)}catch(e){return{ok:false,error:e}}
    if(!q.error)return{ok:true,row:r};
    const msg=q.error.message||'',m=/Could not find the '([a-z_0-9]+)' column/i.exec(msg)||/column "?([a-z_0-9]+)"? (?:of relation|does not exist)/i.exec(msg);
    if(m&&Object.prototype.hasOwnProperty.call(r,m[1])&&m[1]!=='vendedor_id'&&m[1]!=='lgpd_aceite'){
      const val=r[m[1]];delete r[m[1]];
      if(val&&tab==='leads')r.detalhes=((r.detalhes?r.detalhes+' | ':'')+m[1]+': '+val);
      continue}
    return{ok:false,error:q.error}}
  return{ok:false,error:{message:'tentativas esgotadas'}}}
/* grava; se não der, guarda no aparelho e reenvia sozinho (ao abrir o site, ao voltar a internet e a cada minuto) */
async function segSend(tab,row){
  const r=await segInsert(tab,row);
  if(!r.ok){const a=obxGet();a.push({slug:SLUG,tab,row,ts:Date.now(),n:0});obxSet(a)}
  return r.ok}
function obxAdd(it){const a=obxGet().filter(x=>!(it.rpc&&x.rpc===it.rpc&&x.row&&x.row.p&&it.row&&it.row.p&&x.row.p.id===it.row.p.id));a.push(it);obxSet(a)}
async function obxFlush(){
  try{if(typeof sb==='undefined'||!sb)return}catch(e){return}
  const a=obxGet();if(!a.length)return;const resto=[];
  for(const it of a){
    if(it.slug!==SLUG){resto.push(it);continue}
    let ok=false;
    try{if(it.rpc){const r=await sb.rpc(it.rpc,it.row);ok=!(r&&r.error);if(ok&&it.rpc==='registrar_pedido_chat'&&it.row.p&&it.row.p.id)sb.rpc('registrar_rascunho',{p:{id:it.row.p.id,origem:'chat',completo:true}}).then(()=>{},()=>{})}else{const r=await segInsert(it.tab,it.row);ok=r.ok}}catch(e){ok=false}
    if(!ok){it.n=(it.n||0)+1;if(it.n<30&&Date.now()-it.ts<3*864e5)resto.push(it)}}
  obxSet(resto)}
addEventListener('online',()=>obxFlush());setInterval(()=>obxFlush(),60000);setTimeout(()=>obxFlush(),2500);
/* ===== PREENCHIMENTO EM ANDAMENTO: o que o cliente digita já chega ao vendedor, mesmo sem clicar em "Enviar" ===== */
function rascId(key){
  try{const k='rid_v1:'+SLUG+':'+key;let v=sessionStorage.getItem(k);
    if(!v){v=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)});sessionStorage.setItem(k,v)}
    return v}catch(e){return null}}
let _rt=null;const _rcOk={};
function rascunho(origem,key,dados){
  try{if(typeof sb==='undefined'||!sb||typeof sb.rpc!=='function')return}catch(e){return}
  clearTimeout(_rt);
  const go=()=>{const id=rascId(key);if(!id)return;
    const p={id,origem,nome:dados.nome,telefone:dados.telefone,moto_nome:dados.moto_nome,cor:dados.cor,dados},fila=()=>obxAdd({slug:SLUG,rpc:'registrar_rascunho',row:{p},ts:Date.now(),n:0});
    try{sb.rpc('registrar_rascunho',{p}).then(r=>{if(r&&r.error)fila()},()=>fila())}catch(e){fila()}};
  const dg=String((dados&&dados.telefone)||'').replace(/\D/g,'').length,pr=dg>=10&&String((dados&&(dados.nome||dados.nome_completo))||'').trim().length>=2;
  if(pr&&!_rcOk[key]){_rcOk[key]=1;go()}else _rt=setTimeout(go,400)}
function rascCompleto(origem,key){
  try{const id=rascId(key);if(id&&sb&&sb.rpc){const p={id,origem,completo:true};sb.rpc('registrar_rascunho',{p}).then(r=>{if(r&&r.error)obxAdd({slug:SLUG,rpc:'registrar_rascunho',row:{p},ts:Date.now(),n:0})},()=>{})}}catch(e){}}
</script>

async function shrink(f){
  if(!/^image\/(png|jpe?g|webp)$/.test(f.type)||f.size<250e3)return f;
  try{const b=await createImageBitmap(f),k=Math.min(1,1280/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);
    const o=await new Promise(r=>c.toBlob(r,'image/webp',.84));
    return o&&o.type==='image/webp'&&o.size<f.size?new File([o],f.name.replace(/\.\w+$/,'')+'.webp',{type:'image/webp'}):f}catch(e){return f}}
/* reduz em etapas (qualidade melhor) e devolve WebP; mantém a transparência */
async function redim(bmp,w,q){const k=Math.min(1,w/bmp.width),tw=Math.max(1,Math.round(bmp.width*k)),th=Math.max(1,Math.round(bmp.height*k));let src=bmp,cw=bmp.width,ch=bmp.height;
  while(cw/2>=tw){const c=document.createElement('canvas');c.width=Math.round(cw/2);c.height=Math.round(ch/2);const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(src,0,0,c.width,c.height);src=c;cw=c.width;ch=c.height}
  const c=document.createElement('canvas');c.width=tw;c.height=th;const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(src,0,0,tw,th);
  const b=await new Promise(r=>c.toBlob(r,'image/webp',q));if(!b||b.type!=='image/webp')throw new Error('este navegador não gera WebP');return b}
/* cria as versões 320/640/1280 ao lado do arquivo principal (o site escolhe a certa para cada tela) */
async function upVars(file,p){const o=optBase(p),bmp=await createImageBitmap(file);
  for(const w of [320,640,1280]){const b=await redim(bmp,w,w===320?.8:.82),pp=`${o.dir}${o.base}-${w}.webp`;
    const{error}=await sb.storage.from('midia').upload(pp,b,{contentType:'image/webp',cacheControl:'31536000',upsert:true});if(error)throw error}}
async function up(file){file=await shrink(file);
  const p=`${V.id}/${Date.now()}-${Math.random().toString(36).slice(2,7)}-${file.name.replace(/[^\w.]/g,'_')}`;
  const{error}=await sb.storage.from('midia').upload(p,file,{cacheControl:'31536000'});if(error)throw error;
  if(/^image\/(png|jpe?g|webp)$/.test(file.type)){try{await upVars(file,p)}catch(e){console.warn('versões leves não criadas:',e)}}   // se falhar, o site usa o arquivo principal
  return sb.storage.from('midia').getPublicUrl(p).data.publicUrl;
}
/* capa do vídeo (um quadro do próprio arquivo, feito no aparelho: não gasta internet) */
function capaVideo(file){return new Promise(ok=>{const v=document.createElement('video'),u=URL.createObjectURL(file);let fim=false;const f=b=>{if(fim)return;fim=true;try{URL.revokeObjectURL(u);v.removeAttribute('src')}catch(e){}ok(b)};setTimeout(()=>f(null),20000);
  v.muted=true;v.playsInline=true;v.preload='metadata';v.onerror=()=>f(null);v.onloadedmetadata=()=>{try{v.currentTime=Math.min(1,(v.duration||2)/4)}catch(e){f(null)}};
  v.onseeked=()=>{try{const W=v.videoWidth||640,H=v.videoHeight||360,k=Math.min(1,640/W),c=document.createElement('canvas');c.width=Math.round(W*k);c.height=Math.round(H*k);c.getContext('2d').drawImage(v,0,0,c.width,c.height);c.toBlob(b=>f(b&&b.type==='image/webp'?b:null),'image/webp',.78)}catch(e){f(null)}};v.src=u})}

async function testarEntrega(){
  const gid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)});
  const box=document.createElement('div');box.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(18,18,28,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px';
  box.innerHTML='<div class="te"><h3>🧪 Teste de entrega</h3><p class="mu" style="margin:0 0 10px">Simulando um cliente no seu site…</p><div id="te_r"></div><button id="te_x" class="btn" style="margin-top:14px;width:100%">Fechar</button></div>';
  document.body.appendChild(box);box.querySelector('#te_x').onclick=()=>box.remove();
  const rows=[],draw=()=>{box.querySelector('#te_r').innerHTML=rows.map(r=>r[3]?`<div class="te-fin ${r[1]?'ok':'er'}">${r[1]?'✅':'⚠️'} ${esc(r[0])}</div>`:`<div class="te-r"><span>${r[1]?'✅':'❌'}</span><div><b>${esc(r[0])}</b>${r[2]?'<small>'+esc(r[2])+'</small>':''}</div></div>`).join('')};
  const add=(n,ok,d)=>{rows.push([n,ok,d]);draw()};
  try{
    const anon=supabase.createClient(SU,SUPABASE_KEY.trim(),{global:{headers:{'x-vendedor':SLUG}},auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
    const tag='__TESTE_ENTREGA__',pid=gid();
    let r=await anon.rpc('registrar_pedido_chat',{p:{id:pid,completo:true,nome:tag,nome_completo:tag,telefone:'+5568900000000',moto_nome:'TESTE',pagamento:'consorcio',mensagem:'teste de entrega'}});
    add('Chat: cliente termina a conversa',!r.error,r.error?r.error.message:'pedido gravado');
    r=await anon.from('leads').insert({tipo:'teste',nome:tag,telefone:'+5568900000000',moto_nome:'TESTE'});
    add('Formulário de financiamento',!r.error,r.error?r.error.message:'contato gravado');
    r=await anon.rpc('registrar_rascunho',{p:{id:gid(),origem:'financiamento',nome:tag,telefone:'(68) 90000-0000',moto_nome:'TESTE',dados:{nome:tag}}});
    add('Cliente digitando (sem enviar)',!r.error,r.error?r.error.message:'enviado');
    const rd=await sb.from('pedidos_chat').select('id').eq('id',pid);
    add('Seu painel enxerga o que o cliente enviou',!!(rd.data&&rd.data.length),rd.error?rd.error.message:(rd.data&&rd.data.length?'sim':'o pedido foi gravado mas o painel não o enxerga'));
    await sb.from('pedidos_chat').delete().eq('id',pid);await sb.from('leads').delete().eq('nome',tag);try{await sb.from('rascunhos').delete().eq('nome',tag)}catch(e){}
    const falhou=rows.some(x=>!x[1]);
    rows.push([falhou?'Resultado: HÁ FALHAS. Tire um print desta tela e envie ao suporte.':'Resultado: tudo certo, os pedidos chegam ao seu painel.',!falhou,'',true]);draw();
  }catch(e){add('Erro inesperado',false,String(e&&e.message||e))}
}

  const sel=document.getElementById('vdas');if(sel)sel.value=VM.as;

  bx.innerHTML=usa?`<div class="dk-h"><b>Documentos a pedir</b><span class="dk-c" id="dkc"></span><span class="sp"></span><button type="button" class="dk-a" onclick="vdDocsTodos(1)">Marcar todos</button><button type="button" class="dk-a" onclick="vdDocsTodos(0)">Limpar</button></div><div class="dk-l">${VDOCS.map(d=>`<label class="dk-i ${VM.docs[d[0]]?'on':''}"><input type="checkbox" style="position:absolute;opacity:0;width:1px;height:1px;margin:0;padding:0;pointer-events:none" ${VM.docs[d[0]]?'checked':''} onchange="vdDoc('${d[0]}',this)"><span class="dk-ck" aria-hidden="true"></span><span class="dk-ic" aria-hidden="true">${d[1]}</span><span class="dk-t"><b>${esc(d[4])}</b><small>${esc(d[5])}</small></span></label>`).join('')}</div>`:'';
  vdDocsCnt();vdTxt()}
function vdTxt(){document.getElementById('vdtx').value=vdTpl(VM.as,VM.x)}
function vdDoc(k,el){VM.docs[k]=el.checked;const l=el.closest('.dk-i');if(l)l.classList.toggle('on',el.checked);vdDocsCnt();vdTxt()}
function vdDocsCnt(){const c=document.getElementById('dkc');if(c)c.textContent=VDOCS.filter(d=>VM.docs[d[0]]).length+' de '+VDOCS.length}
function vdDocsTodos(on){VDOCS.forEach(d=>VM.docs[d[0]]=!!on);vdGera()}
function vdFecha(){const d=document.getElementById('vdm');if(d)d.remove()}
function vdCopia(){const t=document.getElementById('vdtx').value;navigator.clipboard.writeText(t).then(()=>toast('Mensagem copiada!'),()=>toast('Não foi possível copiar'))}
function vdEnvia(){
  const x=VM.x,t=document.getElementById('vdtx').value,w=wlk(x.telefone);
  if(!w)return toast('Cliente sem telefone válido. Use Copiar.');
  window.open(w+'?text='+encodeURIComponent(t),'_blank');
  const st=VST[x._s];if(st&&(x.status||'novo')==='novo'&&'status' in x){vdSt(x._s,x.id,x._s==='chat'?'atendimento':x._s==='contato'?'atendido':'em_analise');toast('Marcado como em atendimento')}
  vdFecha()}

/* ===================================================================================================
   PAINEL RENOVADO: Início · Clientes · Playbook (10 fases da venda + 100 scripts) · Motos · Meu site

const PB=[{"n":1,"nome":"Prospecção","ic":"🎯","cor":"#64748b","obj":"Abrir conversas com as pessoas certas, de forma leve e sem parecer spam.","quando":"Para quem ainda não falou com você: listas, redes sociais, conhecidos e indicações.","dica":"Seja breve, fale de benefício e faça UMA pergunta. Quem não responde não disse \"não\": disse \"ainda não\".","tag":"","s":[["Primeiro contato (lista fria)","Oi, {nome}! Aqui é {vendedor}, consultor de consórcio Honda. Tudo bem? 😊 Estou ajudando pessoas a conquistarem a moto própria com parcelas que cabem no bolso. Posso te mandar uma simulação rápida, sem compromisso?"],["Depois de curtir ou comentar no Instagram","Oi, {nome}! Vi que você curtiu a {moto} lá no meu perfil 🏍️ Ela é um sucesso mesmo! Quer que eu te mostre quanto fica a parcela no consórcio? Leva 2 minutinhos."],["Quem pediu informação no site","Olá, {nome}! Vi seu interesse na {moto} no meu site. Sou {vendedor} e vou te ajudar. O que é melhor para você: eu te mandar a simulação por aqui ou prefere que eu te ligue?"],["Convite para simulação gratuita","{nome}, que tal descobrir em 2 minutos qual parcela de consórcio cabe no seu bolso para a {moto}? A simulação é gratuita e sem compromisso. Me diz quanto você pensa em pagar por mês e eu monto as opções 👍"],["Quem quer trocar de moto","Oi, {nome}! Soube que você está pensando em trocar de moto. Muita gente usa o consórcio para planejar a próxima sem apertar o orçamento. Quer ver como ficaria para a {moto}?"],["Moto para trabalhar","Oi, {nome}! Tudo bem? Ter moto própria para trabalhar muda o ganho do mês, né? Montei um jeito de você chegar na sua {moto} com parcela fixa, que dá para planejar. Posso te explicar rapidinho?"],["Divulgação em status ou grupo","🏍️ Quer sua moto Honda com parcelas que cabem no bolso e planejando com calma? Faço simulação de consórcio na hora, sem compromisso. Me chama aqui e te mostro as opções para a {moto} e outros modelos. Sou {vendedor}."],["Depois de conversa pessoal ou evento","Oi, {nome}, foi um prazer conversar com você hoje! Como combinado, estou te mandando as informações da {moto}. Qualquer dúvida é só chamar. Qual o melhor horário para eu te ligar e fazer sua simulação?"],["Reaproximar um conhecido","Oi, {nome}! Quanto tempo! 😄 Estou trabalhando com consórcio Honda e lembrei de você. Se estiver pensando em moto nova (sua ou de alguém da família), me conta que eu faço uma simulação sem compromisso."],["Indicado por alguém","Oi, {nome}! Aqui é {vendedor}. [Nome de quem indicou] me passou seu contato e comentou que você está de olho em uma moto. Fico feliz em ajudar! Posso te perguntar rapidinho qual modelo você tem em mente?"]]},{"n":2,"nome":"Recepção","ic":"🤝","cor":"#2563eb","obj":"Receber bem, responder rápido e criar confiança nos primeiros minutos.","quando":"Assim que o cliente chama, preenche um formulário ou conversa no chat.","dica":"Responda em até 5 minutos. Primeiro acolha, depois pergunte. Nada de despejar preço logo de cara.","tag":"","s":[["Boas-vindas padrão","Oi, {nome}! Seja bem-vindo(a)! 😊 Aqui é {vendedor}. Vi que você se interessou pela {moto}. Vou te ajudar a escolher o melhor jeito de conquistá-la. Posso te fazer algumas perguntas rápidas?"],["Fora do horário de atendimento","Oi, {nome}! Recebi sua mensagem 🙌 Agora estou fora do horário de atendimento, mas amanhã cedo eu te respondo com todo o cuidado sobre a {moto}. Se quiser, já me diga quanto pensa em pagar por mês, assim adianto sua simulação."],["Confirmação de dados recebidos","{nome}, recebi seus dados certinho! ✅ Já vou preparar sua simulação da {moto} e te retorno em breve por aqui. Se precisar corrigir alguma informação, é só me avisar."],["Cliente já escolheu a moto","Ótima escolha, {nome}! A {moto} agrada muita gente. Antes de te passar os valores, me conta: você vai usar mais para o dia a dia, trabalho ou lazer? Assim eu te indico o plano ideal."],["Apresentação pessoal curta","Prazer, {nome}! Sou {vendedor}, consultor Honda. Meu trabalho é te explicar tudo sem enrolação e achar a opção que cabe no seu bolso. Pode me chamar à vontade para qualquer dúvida, combinado? 🤝"],["Pedir permissão para perguntar","{nome}, para eu te passar a opção certa, posso te fazer 3 perguntas rápidas? Leva menos de 1 minuto e evita você perder tempo com algo que não serve."],["Cliente mandou só um 'oi'","Oi, {nome}! Tudo bem? 😊 Aqui é {vendedor}. Em que posso te ajudar hoje: ver parcelas de consórcio, financiamento ou tirar dúvidas sobre alguma moto?"],["Cliente pede o preço direto","Claro, {nome}! Já te passo. Só para o valor vir certinho para você: a {moto} é para uso pessoal ou trabalho, e quanto você pensa em pagar por mês? Com isso eu já te mando a melhor opção."],["Chegou por anúncio ou indicação","Oi, {nome}! Que bom que você chamou. Vou te mostrar as condições atuais da {moto} e das outras que podem te interessar. Qual a sua prioridade: menor parcela ou menor prazo?"],["Retorno de ligação perdida","Oi, {nome}, aqui é {vendedor}. Vi que a gente se desencontrou por telefone. Posso falar agora ou prefere conversar por aqui? Fico à disposição sobre a {moto}. 📞"]]},{"n":3,"nome":"Sondagem","ic":"🔎","cor":"#7c3aed","obj":"Entender necessidade, orçamento e momento para recomendar com precisão.","quando":"Antes de apresentar os planos.","dica":"Pergunte mais do que fala. Cada resposta vira um argumento de venda personalizado.","tag":"","s":[["Para que vai usar a moto","{nome}, me conta: para que você vai usar a {moto}? (trabalho, faculdade, lazer, família...) Assim eu escolho o plano que mais combina com a sua rotina."],["Parcela mensal confortável","Para eu não te mostrar nada fora da sua realidade: qual valor de parcela mensal você acha confortável, {nome}? Pode ser uma média, depois a gente ajusta."],["Entrada ou lance","{nome}, você pretende dar algum lance, ou prefere começar só com as parcelas? Sem problema nenhum nas duas opções, é só para eu montar a simulação certa."],["Urgência e prazo","Você precisa da moto com urgência ou está planejando para os próximos meses? Isso muda a forma como eu te oriento, {nome}."],["Moto na troca","{nome}, você tem alguma moto hoje? Se tiver, me diz modelo e ano. Dependendo do caso, dá para pensar numa estratégia que ajude no seu planejamento."],["Experiência anterior","Você já fez consórcio ou financiamento antes, {nome}? Como foi a experiência? Quero entender o que você gostou e o que não gostou para te atender melhor."],["Quem decide a compra","{nome}, a decisão é só sua ou mais alguém participa (esposa, marido, família)? Se quiser, preparo um resumo bem simples para você mostrar para a pessoa."],["Habilitação e documentos","Só para eu planejar os próximos passos: você já tem a CNH? E os documentos pessoais estão em dia? Qualquer coisa que falte, eu te oriento, tá?"],["Renda, sem constranger","Para indicar o plano com segurança, posso saber de forma geral como é a sua renda (CLT, autônomo, aposentado...)? Não precisa de valores exatos agora, {nome}."],["Resumo da sondagem","Deixa eu ver se entendi, {nome}: você quer a {moto}, com parcela em torno de [valor], [com/sem] lance e precisa dela [prazo]. Foi isso? Se estiver certo, já monto as melhores opções para você."]]},{"n":4,"nome":"Apresentação","ic":"🏍️","cor":"#c026d3","obj":"Mostrar a solução certa: moto e plano que cabem, com clareza e transparência.","quando":"Depois da sondagem, quando você já sabe o que o cliente precisa.","dica":"Mostre 2 ou 3 opções, nunca 10. Explique taxa e contemplação sem prometer data. Transparência vende.","tag":"","s":[["Consórcio em 30 segundos","{nome}, o consórcio funciona assim: você entra em um grupo, paga uma parcela mensal e todo mês alguns participantes são contemplados por sorteio ou lance. Não tem juros, tem uma taxa de administração, e você planeja sua moto com parcela fixa. Faz sentido para você?"],["Recomendação da moto","Pelo que você me contou, {nome}, a {moto} é a que mais combina com você. Ela é econômica, tem boa aceitação na revenda e atende bem o seu uso. Quer que eu te mostre quanto fica a parcela?"],["Consórcio x financiamento","Sem enrolação, {nome}: no financiamento você leva a moto na hora, mas paga juros. No consórcio você espera a contemplação, mas costuma pagar menos no total, porque não tem juros. Dá para escolher o que combina com sua urgência. Quer comparar os dois com números?"],["Parcela do plano","Para a {moto}, uma das opções é {parcela}. Se preferir parcela menor ou prazo menor, tenho outras combinações. Qual desses caminhos faz mais sentido para o seu bolso, {nome}?"],["Contemplação sem promessa","{nome}, a contemplação acontece por sorteio ou por lance, conforme as regras do grupo. Não dá para garantir uma data, mas eu te explico como aumentar suas chances e como acompanhar as assembleias. Quer que eu detalhe?"],["Taxa de administração","Vou ser bem transparente, {nome}: o consórcio não cobra juros, mas tem taxa de administração, que está diluída nas parcelas. Mesmo somando tudo, costuma sair mais barato que financiar. Posso te mostrar a conta completa."],["Vantagens do consórcio","O que as pessoas mais gostam no consórcio, {nome}: parcela previsível, sem juros, dá para planejar sem susto e você pode dar lance quando quiser adiantar. É um jeito tranquilo de chegar na {moto}. 👍"],["Vídeo explicativo","{nome}, separei um vídeo curtinho explicando direitinho como funciona o consórcio Honda. Dá uma olhada quando puder e me diz o que achou. Depois a gente decide o próximo passo 🎥"],["Três opções de simulação","Montei 3 opções para você, {nome}: 1) parcela mais baixa, 2) equilíbrio entre parcela e prazo, 3) prazo mais curto. Qual delas combina mais com você? Aí eu aprofundo só nela."],["Normalizar a dúvida","{nome}, muita gente começa exatamente como você: com dúvida e olhando o orçamento. O que ajuda é ver os números reais. Posso te mandar sua simulação detalhada, para você decidir com calma?"]]},{"n":5,"nome":"Objeções","ic":"🛡️","cor":"#d97706","obj":"Transformar dúvidas em conversa honesta, sem pressionar.","quando":"Sempre que o cliente hesitar, comparar ou adiar.","dica":"Objeção é pedido de informação. Valide o que o cliente sente, pergunte o motivo real e só depois responda.","tag":"obj","s":[["“Está caro”","Entendo, {nome}, e agradeço a sinceridade. Para eu te ajudar melhor: o que pesa mais, o valor da parcela ou o prazo? Posso ajustar o plano para algo mais leve, com mais parcelas, por exemplo. Vamos ver as opções?"],["“Vou pensar”","Claro, {nome}, é uma decisão importante e faz bem pensar. Só me ajuda a te ajudar: tem algum ponto específico que ficou em dúvida? Se eu puder esclarecer agora, você decide com mais segurança."],["“Preciso falar com meu/minha esposo(a)”","Faz todo sentido, {nome}! Que tal eu preparar um resumo simples com a moto, a parcela e como funciona, para você mostrar? Se quiser, marcamos uma conversa rápida com vocês dois."],["“E se demorar a ser contemplado?”","É uma dúvida muito comum, {nome}. A contemplação é por sorteio ou lance, e não há garantia de data. Por isso eu te explico as estratégias, como o lance, e se você tem urgência a gente compara com outras opções. Quer ver juntos?"],["“Não gosto de taxa de administração”","Entendo, {nome}. A taxa existe em todo consórcio, e o importante é comparar o custo total. Mesmo com a taxa, costuma ficar mais barato que os juros de um financiamento. Posso te mostrar os dois lado a lado?"],["“Prefiro financiar”","Sem problema, {nome}, financiamento é uma ótima opção para quem precisa da moto agora. Posso fazer a simulação dos dois para você comparar parcela e valor total. Aí você escolhe com números na mão, combinado?"],["“Não tenho entrada”","Tranquilo, {nome}! O consórcio geralmente não exige entrada: você começa só com as parcelas. O lance é opcional, para quem quer adiantar. Vamos ver um plano que caiba só nas parcelas?"],["“Já tenho outra proposta”","Ótimo que você está comparando, {nome}! Me manda os valores que recebeu? Eu monto uma comparação transparente, com parcela, taxa e prazo, para você escolher o que for melhor, mesmo que não seja o meu."],["“Não confio / ouvi histórias ruins”","Entendo sua cautela, {nome}, e ela é válida. O consórcio é regulamentado por lei e fiscalizado pelo Banco Central. Se quiser, te mostro o contrato antes, para você tirar todas as dúvidas com calma e sem compromisso."],["“Agora não é o momento”","Respeito totalmente, {nome}. Só uma ideia: quanto antes você entra em um grupo, mais cedo começa a concorrer nas assembleias. Se preferir, deixo sua simulação guardada e te chamo daqui a [prazo]. Pode ser?"]]},{"n":6,"nome":"Acompanhamento","ic":"📆","cor":"#ea580c","obj":"Manter contato útil até a decisão, sem ser chato.","quando":"Depois de enviar proposta ou simulação e o cliente não responder.","dica":"Cada contato precisa trazer algo novo: uma informação, uma pergunta simples ou uma facilidade.","tag":"","s":[["Follow-up de 24 horas","Oi, {nome}! Tudo bem? Passando para saber se deu para ver a simulação da {moto} que te enviei. Ficou alguma dúvida? Se quiser, ajusto a parcela rapidinho. 😊"],["Follow-up de 3 dias com conteúdo","{nome}, lembrei de você! Separei um conteúdo rápido sobre como funciona a contemplação, pode ajudar na sua decisão. Quer que eu te mande?"],["Follow-up com novidade","Oi, {nome}! Saiu atualização nas condições do consórcio e achei que valia te avisar, por causa da {moto}. Posso te passar os valores atualizados?"],["Visualizou e não respondeu","{nome}, vi que você deu uma olhada na proposta 👀 Sem pressa nenhuma. Se tiver qualquer dúvida, mesmo pequena, me manda que eu respondo na hora."],["Lembrete de documentos","Oi, {nome}! Para avançarmos com a {moto}, falta só me enviar [documentos]. Pode mandar por aqui mesmo, com foto nítida. Qualquer dificuldade, me avisa que eu te ajudo!"],["Pediu para retornar depois","Oi, {nome}! Combinamos de conversar hoje, lembra? 😊 Tem 2 minutinhos para a gente falar sobre a {moto}?"],["Pergunta simples de 1, 2 ou 3","{nome}, uma pergunta rápida: a {moto} ainda está nos seus planos? Responde 1 para SIM, 2 para ainda estou avaliando ou 3 para outro momento. Assim eu te atendo do jeito certo."],["Simulação atualizada + check","{nome}, segue sua simulação atualizada da {moto}: {parcela}. Se a parcela ficou confortável, o próximo passo é bem simples. O que você achou?"],["Análise em andamento","Oi, {nome}! Passando para te atualizar: sua análise está em andamento e, assim que eu tiver retorno, te aviso por aqui. Se precisar de algo enquanto isso, é só chamar."],["Último follow-up gentil","{nome}, não quero ser insistente 😊 Vou deixar sua simulação da {moto} guardada. Se mudar de ideia ou surgir dúvida, é só me chamar. Estou por aqui!"]]},{"n":7,"nome":"Fechamento","ic":"✅","cor":"#16a34a","obj":"Conduzir a decisão com naturalidade, respeitando o tempo do cliente.","quando":"Quando o cliente já entendeu o plano e demonstrou interesse.","dica":"Fechar é um próximo passo, não uma pressão. Pergunte o que falta, simplifique o caminho e deixe a decisão com o cliente.","tag":"fech","s":[["Convite natural","{nome}, pelo que conversamos, a {moto} com {parcela} cabe direitinho no que você precisa. Se estiver tudo certo para você, o próximo passo é bem simples. Quer que eu te explique como é?"],["Resumo + próximo passo","Então combinamos assim, {nome}: moto {moto}, plano {parcela}, parcelas fixas e as regras que te expliquei. Se estiver de acordo, eu organizo a documentação e cuido de tudo por aqui."],["Opção A ou B","{nome}, para facilitar: prefere o plano com parcela menor ou o com prazo menor? Me diz a sua preferência e eu preparo a proposta já nesse formato."],["Fechar por etapas","Sem pressa, {nome}. Que tal a gente adiantar só a parte dos documentos? Assim, quando você decidir, já está tudo pronto e você não perde tempo."],["Tabela atualizada (sem escassez falsa)","Um aviso honesto, {nome}: os valores seguem a tabela do consórcio e podem ser ajustados nas atualizações. Por isso, se a proposta estiver boa para você, vale avançarmos. Mas só se fizer sentido para você, tá?"],["O que falta para decidir","{nome}, me ajuda com uma coisa: o que falta para você se sentir 100% seguro(a) em seguir com a {moto}? Qualquer ponto, eu resolvo."],["Cliente indeciso: reduzir o risco","Entendo a insegurança, {nome}. Que tal eu te mandar o contrato para você ler com calma e tirar todas as dúvidas antes de qualquer decisão? Assim não tem nenhuma surpresa."],["Lista de documentos","Ótimo, {nome}! 🎉 Para seguirmos, preciso de: 📄 documento com foto aberto (RG ou CNH), 🔢 CPF, 🏠 comprovante de endereço recente e, se tiver, comprovante de renda. Pode mandar por aqui, com foto bem nítida."],["Confirmação de dados","{nome}, vou confirmar seus dados antes de formalizar: nome completo, CPF, telefone e endereço. Se estiver tudo certo, me responde 'confirmado' e eu sigo com a proposta da {moto}."],["Fechamento depois de uma objeção","Obrigado por ter sido sincero(a) comigo, {nome}. Com o que combinamos, a {moto} ficou assim: {parcela}. Se isso resolve sua preocupação, podemos dar o próximo passo?"]]},{"n":8,"nome":"Pós-venda","ic":"🎉","cor":"#0d9488","obj":"Cuidar do cliente depois da venda para ele se sentir seguro e voltar.","quando":"Depois que o contrato é assinado e durante os primeiros meses.","dica":"Pós-venda é onde nasce a indicação. Um contato simples e humano vale mais que qualquer anúncio.","tag":"","s":[["Parabéns pela adesão","Parabéns, {nome}! 🎉🏍️ Você deu o primeiro grande passo para conquistar a {moto}. Pode contar comigo em tudo, durante todo o caminho. Qualquer dúvida, é só chamar!"],["Explicar os próximos passos","{nome}, para você ficar tranquilo(a), os próximos passos são: 1) pagamento da primeira parcela, 2) participação nas assembleias, 3) acompanhamento do seu grupo. Eu vou te avisando de cada etapa por aqui."],["Lembrete da primeira parcela","Oi, {nome}! Lembrete amigo: sua primeira parcela vence em [data]. Pagando em dia você mantém tudo certinho no grupo. Se precisar de ajuda com o boleto, me avisa."],["Check de 7 dias","Oi, {nome}! Passando para saber como está tudo depois da adesão. Ficou alguma dúvida sobre o contrato ou as parcelas? Estou aqui para ajudar."],["Quando for contemplado","{nome}, quando você for contemplado(a), eu te acompanho em tudo: escolha da moto, documentação e retirada. Fica tranquilo(a), você não vai ficar sozinho(a) nessa etapa."],["Dica de cuidado com a moto","Dica de quem gosta de moto, {nome}: revisões em dia mantêm sua {moto} valorizada e segura. 🔧 Quando chegar a hora, eu te lembro das revisões."],["Pesquisa de satisfação","{nome}, de 0 a 10, o quanto você recomendaria o meu atendimento? E o que eu poderia melhorar? Sua opinião me ajuda a atender cada vez melhor. 🙏"],["Aniversário","Feliz aniversário, {nome}! 🎂 Que seu novo ano seja cheio de conquistas e muitas estradas boas. Um abraço do {vendedor}!"],["Resolver uma reclamação","{nome}, sinto muito pelo transtorno e obrigado por me avisar. Já estou cuidando disso agora e te retorno com a solução o quanto antes. Pode contar comigo."],["Convite para receber novidades","{nome}, sempre que surgirem novidades de modelos ou de condições de consórcio eu te aviso por aqui. Quer receber? Se preferir não receber, é só me dizer."]]},{"n":9,"nome":"Indicação","ic":"🌟","cor":"#db2777","obj":"Transformar clientes satisfeitos em novas vendas, com naturalidade.","quando":"Depois de um bom atendimento, da adesão ou da entrega da moto.","dica":"Peça no momento de alegria do cliente e facilite: dê um texto pronto para ele encaminhar.","tag":"","s":[["Pedido de indicação","{nome}, fico muito feliz de ter te ajudado! 😊 Se você conhece alguém que também sonha com uma moto, pode me indicar? Eu cuido com o mesmo carinho."],["Texto pronto para o cliente encaminhar","{nome}, se quiser indicar, é só encaminhar isto: \"Oi! Conheço o {vendedor}, que faz simulação de consórcio Honda sem compromisso e atende muito bem. Vale conversar com ele!\" Agradeço de coração! 🙏"],["Pedir três nomes","Se você pudesse async function pvFile(el){const f=el.files&&el.files[0];if(!f)return;if(!/^video\/(mp4|webm)$/i.test(f.type||'')&&!/\.(mp4|webm)$/i.test(f.name)){el.value='';return toast('Envie o vídeo em MP4 ou WebM')}if(f.size>50*1024*1024){el.value='';return toast('O vídeo passa de 50 MB: reduza o tamanho do arquivo e envie de novo')}
  const L2=[...(CF().videos||[])];if(vTot()>=LIMV()){el.value='';return toast(limMsg('vídeos',LIMV()))}
  try{toast('Enviando vídeo...');const r=await upVideo(f),u=r.u;L2.push({t:($('#pv_t').value||'').trim()||f.name.replace(/\.[^.]+$/,'').slice(0,60),u,...(r.p?{p:r.p}:{}),on:true});await pvSave(L2);pVideos();toast('Vídeo publicado no seu site!')}catch(e){el.value='';toast('Erro: '+(e&&e.message||e))}}
async function pvTog(i,on){const L2=[...(CF().videos||[])];if(!L2[i])return;L2[i]={...L2[i],on};try{await pvSave(L2);pVideos();toast(on?'Vídeo publicado':'Vídeo oculto do site')}catch(e){toast('Erro: '+(e&&e.message||e))}}
async function pvMove(i,d){const L2=[...(CF().videos||[])],j=i+d;if(j<0||j>=L2.length)return;[L2[i],L2[j]]=[L2[j],L2[i]];try{await pvSave(L2);pVideos()}catch(e){toast('Erro: '+(e&&e.message||e))}}
async function pvDel(i){if(!confirm('Remover este vídeo do site?'))return;const L2=[...(CF().videos||[])];L2.splice(i,1);try{await pvSave(L2);pVideos();toast('Vídeo removido')}catch(e){toast('Erro: '+(e&&e.message||e))}}

function pEntregas(){
  if(!('config' in V)){$(PNS).innerHTML='<p class="mu">Para publicar fotos e vídeos de clientes, rode o SQL único (coluna config) no Supabase e recarregue a página.</p>';return}
  const L2=(CF().entregas||[]),ct=enCont(L2);
  $(PNS).innerHTML=`<h3 style="margin-top:0">Mais um sonho realizado</h3><p class="mu">Fotos e vídeos de clientes (entrega da moto ou contemplação). Eles aparecem no seu site como prova social. Só publique com a autorização do cliente.</p>
  <div class="fm-grid"><div class="fld span2"><label class="l" for="en_t">Tipo do registro</label><select id="en_t"><option value="e">Entrega da moto</option><option value="c">Contemplação</option></select></div><div class="fld"><label class="l" for="en_n">Nome do cliente</label><input id="en_n" maxlength="40" placeholder="Ex.: Rodson"></div><div class="fld"><label class="l" for="en_m">Moto entregue</label><input id="en_m" maxlength="50" placeholder="Ex.: CG 160 Titan"></div></div>
  <label class="chk" style="margin:6px 0 14px"><input type="checkbox" id="en_ok"><span>Tenho a autorização do cliente para publicar a foto ou o vídeo no meu site</span></label>
  <div class="pv-act"><label class="upl">📷 Escolher uma foto e publicar<input type="file" accept="image/*" onchange="enAdd(this)" hidden></label><label class="upl">🎬 Enviar vídeo (MP4, até 50 MB)<input type="file" accept="video/mp4,video/webm" onchange="enAddVideo(this)" hidden></label></div>
  <div class="pv-dica"><b>Como os vídeos aparecem no site</b><br>Baixe o vídeo (do Instagram ou do celular) e envie o arquivo aqui, em <b>MP4</b> (até 50 MB). No site ele aparece com uma <b>capa</b>, numa fila que rola devagar. Quando o cliente <b>passa o mouse</b> (ou segura o dedo), o vídeo <b>começa a rodar</b>. Ao <b>clicar</b>, abre em <b>tela maior</b>.</div>
  <p class="en-cont"><b>Fotos:</b> ${ct.f}/${LIMF()} · <b>Vídeos no site:</b> ${vTot()}/${LIMV()}</p>
  <div class="en-adm">${L2.map((e,i)=>{const leg=e.u&&!e.f&&!mp4Ok(e.u);return `<div class="en-it${leg?' off':''}">${e.f?`<img ${IMGA(e.f,'th')} alt="">`:`<span class="en-vi" aria-hidden="true">🎬</span>`}<div><b>${esc(e.n)}</b><small>${e.t==='c'?'Contemplação':'Entrega'} · ${leg?'link antigo: não aparece mais no site (remova e envie o arquivo do vídeo)':(e.u&&!e.f?'Vídeo · ':'')+esc(e.m||'')}</small></div><button type="button" class="btn sm" onclick="enDel(${i})">Remover</button></div>`}).join('')||'<p class="mu" style="margin-top:14px">Nenhum registro publicado ainda.</p>'}</div>`}
async function enSave(L2){const config={...CF(),entregas:L2};const{error}=await sb.from('vendedores').update({config}).eq('id',V.id);if(error)throw error;V.config=config}
async function enAdd(el){const f=el.files&&el.files[0];if(!f)return;const n=($('#en_n').value||'').trim(),m=($('#en_m').value||'').trim();
  if(!n){el.value='';return toast('Informe o nome do cliente')}if(!$('#en_ok').checked){el.value='';return toast('Confirme que você tem a autorização do cliente')}
  const L2=[...(CF().entregas||[])];if(enCont(L2).f>=LIMF()){el.value='';return toast(limMsg('fotos',LIMF()))}
  try{toast('Enviando foto...');const u=await up(f);L2.unshift({f:u,n,m,t:($('#en_t')&&$('#en_t').value==='c')?'c':'e'});await enSave(L2);pEntregas();toast('Foto publicada no seu site!')}catch(e){el.value='';toast('Erro: '+(e&&e.message||e))}}
async function enAddVideo(el){const f=el.files&&el.files[0];if(!f)return;const n=($('#en_n').value||'').trim(),m=($('#en_m').value||'').trim();
  if(!n){el.value='';return toast('Informe o nome do cliente')}if(!$('#en_ok').checked){el.value='';return toast('Confirme que você tem a autorização do cliente')}
  if(!/^video\/(mp4|webm)$/i.test(f.type||'')&&!/\.(mp4|webm)$/i.test(f.name)){el.value='';return toast('Envie o vídeo em MP4 ou WebM')}
  if(f.size>50*1024*1024){el.value='';return toast('O vídeo passa de 50 MB: reduza o tamanho do arquivo e envie de novo')}
  const L2=[...(CF().entregas||[])];if(vTot()>=LIMV()){el.value='';return toast(limMsg('vídeos',LIMV()))}
  try{toast('Enviando vídeo...');const r=await upVideo(f),u=r.u;L2.unshift({u,...(r.p?{p:r.p}:{}),n,m,t:($('#en_t')&&$('#en_t').value==='c')?'c':'e'});await enSave(L2);pEntregas();toast('Vídeo publicado no seu site!')}catch(e){el.value='';toast('Erro: '+(e&&e.message||e))}}
async function enDel(i){if(!confirm('Remover esta foto do site?'))return;const L2=[...(CF().entregas||[])];L2.splice(i,1);try{await enSave(L2);pEntregas();toast('Foto removida')}catch(e){toast('Erro: '+(e&&e.message||e))}}


/* ---- PRÉVIA DO LINK (cartão que aparece no WhatsApp / Instagram): título, frase, foto e imagem gerada ---- */
const ogPartes=t=>{t=String(t||'').trim();const i=t.indexOf('|');return i>0?[t.slice(0,i).trim(),t.slice(i+1).trim()]:[t,'']};
const ogImg=u=>new Promise((ok,no)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>ok(i);i.onerror=()=>no(new Error('foto'));i.src=u});
function ogQuebra(c,txt,mx,lin){const w=String(txt||'').split(/\s+/).filter(Boolean),L=[];let a='';for(const x of w){const t=a?a+' '+x:x;if(c.measureText(t).width>mx&&a){L.push(a);a=x;if(L.length>=lin)break}else a=t}if(a&&L.length<lin)L.push(a);
  if(w.length&&L.length===lin){const j=L.join(' ');if(j.length<String(txt).trim().length){let u=L[lin-1];while(u.length>1&&c.measureText(u+'…').width>mx)u=u.slice(0,-1);L[lin-1]=u.trimEnd()+'…'}}return L}
async function ogDraw(cv,nome,acento,frase,foto){
  const W=1200,H=630;cv.width=W;cv.height=H;const c=cv.getContext('2d');
  try{await document.fonts.load('800 70px Inter');await document.fonts.load('600 32px Inter')}catch(e){}
  let g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,'#1b1b23');g.addColorStop(1,'#07070a');c.fillStyle=g;c.fillRect(0,0,W,H);
  let r=c.createRadialGradient(1060,30,10,1060,30,560);r.addColorStop(0,'rgba(224,20,20,.55)');r.addColorStop(1,'rgba(224,20,20,0)');c.fillStyle=r;c.fillRect(0,0,W,H);
  r=c.createRadialGradient(60,650,10,60,650,430);r.addColorStop(0,'rgba(138,12,12,.55)');r.addColorStop(1,'rgba(138,12,12,0)');c.fillStyle=r;c.fillRect(0,0,W,H);
  const px=40,py=40,pw=500,ph=H-80,rd=38;
  c.save();c.beginPath();c.roundRect?c.roundRect(px,py,pw,ph,rd):c.rect(px,py,pw,ph);c.clip();
  let ok=false;if(foto){try{const im=await ogImg(foto),k=Math.max(pw/im.width,ph/im.height),w=im.width*k,h=im.height*k;c.drawImage(im,px+(pw-w)/2,py+(ph-h)*.22,w,h);ok=true}catch(e){}}
  if(!ok){c.fillStyle='#c80000';c.fillRect(px,py,pw,ph);c.fillStyle='#fff';c.font='800 150px Inter, sans-serif';c.textAlign='center';c.fillText((nome||'?').trim().charAt(0).toUpperCase(),px+pw/2,py+ph/2+52);c.textAlign='left'}
  c.restore();c.strokeStyle='rgba(255,255,255,.28)';c.lineWidth=3;c.beginPath();c.roundRect?c.roundRect(px,py,pw,ph,rd):c.rect(px,py,pw,ph);c.stroke();
  const x=590,mx=W-x-50;c.textBaseline='alphabetic';
  c.fillStyle='#ff9a9a';c.font='800 22px Inter, sans-serif';if('letterSpacing' in c)c.letterSpacing='4px';c.fillText('CONSÓRCIO E FINANCIAMENTO HONDA',x,110);if('letterSpacing' in c)c.letterSpacing='0px';
  let y=190,nf=74,sp=80;c.fillStyle='#fff';c.font='800 74px Inter, sans-serif';let ln=ogQuebra(c,nome||'',mx,2);if(ln.length>1){nf=62;sp=68;c.font='800 62px Inter, sans-serif';ln=ogQuebra(c,nome||'',mx,2)}ln.forEach(t=>{c.fillText(t,x,y);y+=sp});
  if(acento){y+=6;const gg=c.createLinearGradient(x,0,x+mx,0);gg.addColorStop(0,'#ff6a6a');gg.addColorStop(1,'#ff9a3a');c.fillStyle=gg;c.font='800 46px Inter, sans-serif';ogQuebra(c,acento,mx,2).forEach(t=>{c.fillText(t,x,y);y+=56})}
  const bx=x,by=H-120,bw=330,bh=68;
  if(frase){y+=10;c.fillStyle='rgba(255,255,255,.86)';c.font='600 30px Inter, sans-serif';const room=Math.max(1,Math.min(3,Math.floor((by-16-y)/40)));ogQuebra(c,frase,mx,room).forEach(t=>{c.fillText(t,x,y);y+=40})}
  c.fillStyle='#d90f0f';c.beginPath();c.roundRect?c.roundRect(bx,by,bw,bh,20):c.rect(bx,by,bw,bh);c.fill();c.fillStyle='#fff';c.font='800 30px Inter, sans-serif';c.fillText('Simule agora  →',bx+38,by+45)}
function ogBlob(cv){return new Promise(async(ok,no)=>{let q=.88,b=null;for(let i=0;i<7;i++){b=await new Promise(r=>cv.toBlob(r,'image/jpeg',q));if(!b)return no(new Error('imagem'));if(b.size<=240*1024)break;q-=.07}ok(b)})}
let OGT=null;
function pPrevia(){
  if(!('config' in V)){$(PNS).innerHTML='<p class="mu">Para personalizar a prévia, rode o SQL único (coluna config) no Supabase e recarregue a página.</p>';return}
  const og=CF().og||{},host=location.host,link='https://'+host+'/'+SLUG;
  $(PNS).innerHTML=`<h3 style="margin-top:0">Prévia do link (WhatsApp e Instagram)</h3><p class="mu">É o cartão que aparece quando você manda o link do seu site numa conversa ou numa rede social: <b>foto, nome e uma frase de chamada</b>.</p>
  <div class="pr-g"><div class="pr-f">
    <div class="fld"><label class="l" for="og_t">Título <small>(até 70 letras)</small></label><input id="og_t" maxlength="70" value="${esc(og.t||'')}" placeholder="${esc(V.nome+' | Consórcio e financiamento Honda')}" oninput="ogLive()"></div>
    <div class="fld"><label class="l" for="og_d">Frase de chamada <small>(até 160 letras)</small></label><textarea id="og_d" maxlength="160" rows="3" placeholder="Simule consórcio e financiamento de motos Honda direto comigo. Atendimento rápido." oninput="ogLive()">${esc(og.d||'')}</textarea></div>
    <label class="chk" style="margin:4px 0 12px"><input type="checkbox" id="og_c" ${(og.img||!og.t)?'checked':(og.card===0?'':'checked')} onchange="ogLive()"><span>Criar uma <b>imagem de prévia</b> bonita (sua foto + nome + frase). <b>Recomendado.</b></span></label>
    <div class="pv-act"><button type="button" class="btn red" id="og_b" onclick="ogSalvar()">Salvar prévia</button><button type="button" class="btn" onclick="ogCopiar()">Copiar meu link</button></div>
    <p class="mu" style="font-size:12.5px;margin:8px 0 0">Seu link: <b>${esc(link)}</b></p>
    <div class="pv-dica"><b>Dica</b><br>O WhatsApp e o Instagram <b>guardam a prévia por um tempo</b>. Se você mudar e o cartão antigo ainda aparecer, mande o link com <b>?x=2</b> no final (ex.: ${esc(link)}?x=2).</div>
  </div><div class="pr-p"><div class="pr-lbl">Como vai aparecer</div><div class="pr-card" id="og_card"></div></div></div>`;
  ogLive()}
function ogDados(){const t=($('#og_t').value||'').trim(),d=($('#og_d').value||'').trim(),pt=ogPartes(t||V.nome+' | Consórcio e financiamento Honda');return{t:t,d:d,tt:t||V.nome+' | Consórcio e financiamento Honda',dd:d||'Simule consórcio e financiamento de motos Honda direto comigo. Atendimento rápido.',nome:pt[0]||V.nome,acento:pt[1]||(V.bio||'')}}
function ogLive(){clearTimeout(OGT);OGT=setTimeout(async()=>{const k=$('#og_card');if(!k)return;const o=ogDados(),card=$('#og_c').checked;
  k.innerHTML=`${card?'<canvas id="og_cv" class="pr-cv"></canvas>':`<div class="pr-th">${V.foto_url?`<img ${IMGA(V.foto_url,'th')} alt="">`:''}</div>`}<div class="pr-tx"><small>${esc(location.host)}</small><b>${esc(o.tt)}</b><span>${esc(o.dd)}</span></div>`;
  if(card){try{await ogDraw($('#og_cv'),o.nome,o.acento,o.dd,V.foto_url)}catch(e){}}},180)}
function ogCopiar(){const l='https://'+location.host+'/'+SLUG;try{navigator.clipboard.writeText(l).then(()=>toast('Link copiado!'),()=>toast(l))}catch(e){toast(l)}}
function ogRm(u){try{const m=/\/object\/public\/midia\/(.+)$/.exec(String(u||''));if(m&&decodeURIComponent(m[1]).startsWith(V.id+'/og-'))sb.storage.from('midia').remove([decodeURIComponent(m[1])])}catch(e){}}
async function ogSalvar(){const b=$('#og_b'),o=ogDados(),card=$('#og_c').checked;if(b){b.disabled=true;b.textContent='Salvando...'}
  try{const ant=(CF().og||{}).img;const og={...(CF().og||{}),t:o.t,d:o.d};
    if(card){const cv=document.createElement('canvas');await ogDraw(cv,o.nome,o.acento,o.dd,V.foto_url);const blob=await ogBlob(cv),path=`${V.id}/og-${Date.now()}.jpg`;
      const{error:e1}=await sb.storage.from('midia').upload(path,blob,{contentType:'image/jpeg'});if(e1)throw e1;og.img=sb.storage.from('midia').getPublicUrl(path).data.publicUrl;og.w=1200;og.h=630;og.card=1}
    else{delete og.img;delete og.w;delete og.h;og.card=0}
    const config={...CF(),og};const{error}=await sb.from('vendedores').update({config}).eq('id',V.id);if(error)throw error;V.config=config;if(ant&&ant!==og.img)ogRm(ant);
    toast('Prévia salva! Mande o link no WhatsApp para ver.')}catch(e){toast('Erro: '+(e&&e.message||e))}
  if(b){b.disabled=false;b.textContent='Salvar prévia'}}

function pConta(){
  $('#pn').innerHTML=`<div class="seg">${[['perfil','Perfil e contato'],['textos','Textos do site'],['entregas','Clientes felizes'],['videos','Vídeos'],['previa','Prévia do link'],['entrega','Entrega de pedidos']].map(a=>`<button class="${CTAB===a[0]?'on':''}" onclick="CTAB='${a[0]}';pConta()">${a[1]}</button>`).join('')}</div><div id="pn3" class="card2"></div>`;
  PNS='#pn3';
  if(CTAB==='perfil')pPerfil();else if(CTAB==='textos')pSite();else if(CTAB==='entregas')pEntregas();else if(CTAB==='videos')pVideos();else if(CTAB==='previa')pPrevia();else $('#pn3').innerHTML='<h3 style="margin-top:0">Entrega de pedidos</h3><p class="mu">Faz o mesmo que um cliente faz no seu site (chat, formulário e preenchimento) e mostra se cada pedido chegou ao seu painel. Se algo falhar, aparece o erro exato.</p><button class="btn red" onclick="testarEntrega()">🧪 Testar entrega agora</button><p class="mu" style="margin:14px 0 0;font-size:12.5px">Versão do painel: 27/10 · c</p>'}

function pSite(){
  if(!('config' in V)){$(PNS).innerHTML='<p class="mu">Para personalizar os textos do site, rode o SQL opcional (coluna config) no Supabase e recarregue a página.</p>';return}
  const c=CF(),f=(k,l,ph)=>`<label class="l" for="c_${k}">${l}</label><input id="c_${k}" value="${esc(c[k]||'')}" placeholder="${ph}" maxlength="160">`;
  $(PNS).innerHTML=`<p class="mu" style="font-size:13px">Estes textos aparecem no site. Campos em branco não aparecem.</p>${f('titulo','Título principal','Encontre sua próxima Honda')}${f('sub','Frase abaixo do título','Consórcio, financiamento e condições especiais diretamente com seu vendedor.')}${f('aviso','Aviso no topo do catálogo','')}${f('horario','Horário de atendimento','')}${f('endereco','Endereço','')}<button class="btn red" onclick="saveSite()">Salvar site</button>`}
async function saveSite(){const config={...CF()};['titulo','sub','aviso','horario','endereco'].forEach(k=>{const v=$('#c_'+k).value.trim();v?config[k]=v:delete config[k]});
  const{error}=await sb.from('vendedores').update({config}).eq('id',V.id);if(!error)V.config=config;toast(error?'Erro: '+error.message:'Site atualizado!')}

init();
</script>
