<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#080b12">
<title>Painel do Diretor</title>
<link rel="icon" href="/app-honda2-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark}
#R{--ac:#ff3b4e;--card:linear-gradient(180deg,#121a2a,#0d1421);--bar:#0d1421f4;--sh:0 24px 50px -34px #000;--bg:#080b12;--tx:#f3f0e8;--mu:#9d9aa6;--ln:#ffffff14;--ln2:#ffffff26;--c1:#5b8cff;--c2:#2ee6a6;--c3:#ff6b78;--c4:#8b7bff;--okk:#37d48a;--wnn:#f2b441;--av:linear-gradient(135deg,#2a3a63,#18233f);--avt:#cfe0ff;--tab:#ffffff0d;
 min-height:100vh;background:radial-gradient(1100px 520px at 8% -8%,#e4172b2e,transparent 62%),radial-gradient(900px 480px at 96% -4%,#d9b46a1f,transparent 60%),linear-gradient(180deg,#0a0e17,#080b12 480px);color:var(--tx);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#R.lt{color-scheme:light;--ac:#d3112c;--card:#fff;--bar:#fffffff6;--sh:0 24px 50px -36px #1a1a2a88;--bg:#f6f5f3;--tx:#17171c;--mu:#6d6a75;--ln:#1a1a2214;--ln2:#1a1a2230;--c1:#3f6fe0;--c2:#0b9c6b;--c3:#e0394c;--c4:#6d5bd6;--okk:#0b7a43;--wnn:#b3730a;--av:linear-gradient(135deg,#2a3a63,#18233f);--avt:#e6efff;--tab:#80808018;
 background:radial-gradient(1100px 520px at 8% -8%,#e4172b14,transparent 62%),radial-gradient(900px 480px at 96% -4%,#d9b46a26,transparent 60%),#f6f5f3}
html,body{margin:0;background:#080b12}body:has(#R.lt){background:#f6f5f3}
#R *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
#R button{font:inherit;color:inherit;cursor:pointer}
#R .w{max-width:1240px;margin:0 auto;padding:0 clamp(14px,2vw,32px) calc(120px + env(safe-area-inset-bottom,0px))}
/* cabeçalho */
.nh{display:flex;align-items:center;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) 0 14px}
.nh-lg svg{height:46px;width:auto;display:block}
.nh-t{display:flex;flex-direction:column;min-width:0;gap:2px}.nh-t b{font:800 clamp(18px,1.6vw,24px)/1.15 Sora,Inter,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nh-t small{color:var(--mu);font-size:13px}
.nh-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.nh-dt{font-size:13px;font-weight:600;color:var(--mu);padding:9px 14px;border-radius:99px;background:var(--card);border:1px solid var(--ln2);white-space:nowrap}
.nh-b,.nh-u{position:relative;width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--ln2);background:var(--card);color:var(--tx);display:grid;place-items:center;padding:0;font:800 14px Inter,sans-serif}
.nh-b svg{width:22px;height:22px}.nh-b.sp svg{animation:gira .8s linear infinite}@keyframes gira{to{transform:rotate(360deg)}}
.nh-u{background:linear-gradient(135deg,#ff3b4e,#b00d25);color:#fff;border-color:#ff6b7d66}
.pop{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));right:clamp(14px,2vw,40px);z-index:90;min-width:220px;padding:8px;border-radius:18px;background:var(--card);border:1px solid var(--ln2);box-shadow:0 24px 60px -16px #000a;display:grid;gap:2px}
.pop button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;border-radius:12px;background:transparent;font:600 15px Inter,sans-serif;text-align:left}.pop button:hover{background:#ff3b4e1a}.pop svg{width:20px;height:20px;color:var(--mu)}
/* hero */
.hero{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:18px 24px;flex-wrap:wrap;padding:clamp(18px,2vw,28px);margin:0 0 14px;border-radius:22px;background:var(--card);border:1px solid var(--ln2);box-shadow:var(--sh)}
.hero::before{content:"";position:absolute;right:-8%;top:-60%;width:46%;height:220%;background:radial-gradient(closest-side,#ff3b4e2e,transparent);pointer-events:none}
.ht{position:relative;min-width:0}.ht h2{margin:0;font:800 clamp(24px,2.4vw,36px)/1.1 Sora,Inter,sans-serif}.ht p{margin:6px 0 12px;color:var(--mu);font-size:clamp(14px,1vw,16px)}
.hm{display:inline-flex;align-items:center;gap:9px;padding:8px 14px;border-radius:99px;font-size:13.5px;background:#2ee6a61a;border:1px solid #2ee6a655}.hm i{width:9px;height:9px;border-radius:50%;background:#2ee6a6;flex:none}
.tb{position:relative;display:flex;gap:10px;flex-wrap:wrap}
.tbb{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--ln2);background:transparent;font:700 14.5px Inter,sans-serif;transition:background .15s,transform .15s}
.tbb svg{width:19px;height:19px}.tbb:hover{background:#ff3b4e14;transform:translateY(-1px)}
.tbb.pri{background:linear-gradient(135deg,#ff3b4e,#b00d25);border-color:#ff6b7d66;color:#fff;box-shadow:0 12px 26px -12px #ff3b4eaa}
/* período */
.per{display:flex;gap:3px;padding:3px;border-radius:99px;background:var(--tab);width:max-content;max-width:100%;margin:0 0 14px;overflow:auto}
.per button,.tabs2 button{border:0;background:transparent;color:var(--mu);padding:8px 16px;border-radius:99px;font:700 13px Inter,sans-serif;white-space:nowrap}
.per button.on,.tabs2 button.on{background:var(--ac);color:#fff}
.tabs2{display:flex;gap:3px;padding:3px;border-radius:99px;background:var(--tab);flex:none;max-width:100%;overflow:auto}
/* KPIs */
.kg{display:grid;gap:14px;grid-template-columns:repeat(4,minmax(0,1fr));margin:0 0 14px}
.k1{position:relative;padding:18px 18px 14px;border-radius:20px;background:var(--card);border:1px solid var(--ln2);box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;gap:6px}
.k1::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c);opacity:.9}
.k1h{display:flex;align-items:center;gap:10px}.k1i{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:11px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}.k1i svg{width:18px;height:18px}
.k1l{flex:1;font-size:13.5px;font-weight:600;color:var(--mu)}
.k1t{font-style:normal;font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;background:#2ee6a61f;color:var(--okk);white-space:nowrap}.k1t.dn{background:#ff5d6c22;color:#ff6b78}
.k1n{font:800 clamp(28px,2.6vw,40px)/1.05 Sora,Inter,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.k1s{font-size:13px;color:var(--mu)}
.sb{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--tab);gap:2px;margin-top:4px}.sb i{display:block;height:100%;min-width:3px}
.sl{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--mu)}.sl span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:5px}
/* cartões */
.g1,.g2{display:grid;gap:14px;margin:0 0 14px}.g1{grid-template-columns:minmax(0,1.9fr) minmax(0,1fr)}.g2{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{min-width:0;padding:clamp(16px,1.5vw,24px);border-radius:20px;background:var(--card);border:1px solid var(--ln2);box-shadow:var(--sh);margin:0 0 14px}.g1 .card,.g2 .card{margin:0}
.ch-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:0 0 12px;flex-wrap:wrap}
.ch-h h3{margin:0;font:800 clamp(16px,1.2vw,19px)/1.2 Sora,Inter,sans-serif}.ch-h small{display:block;margin-top:3px;color:var(--mu);font-size:13px}
.lk{border:0;background:transparent;color:var(--ac);font:700 13.5px Inter,sans-serif;padding:6px 2px;white-space:nowrap}.lk:hover{text-decoration:underline}
.mu{color:var(--mu)}.vz{color:var(--mu);font-size:14px;margin:8px 0}
/* gráfico */
.cv{position:relative;height:clamp(180px,20vw,250px);touch-action:pan-y;cursor:crosshair;margin:0 8px}
.cv svg{width:100%;height:100%;display:block;overflow:visible}.gl line{stroke:var(--ln2);stroke-dasharray:3 5;vector-effect:non-scaling-stroke}
.vl{position:absolute;top:0;bottom:0;width:1px;background:var(--ln2);opacity:0;pointer-events:none}
.dot{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--ac);transform:translate(-50%,-50%);box-shadow:0 0 0 4px #ff3b4e33;pointer-events:none}
.tip{position:absolute;top:6px;transform:translateX(-50%);opacity:0;pointer-events:none;padding:8px 12px;border-radius:12px;background:#0b1020ee;color:#fff;font-size:12.5px;display:flex;flex-direction:column;gap:2px;white-space:nowrap;border:1px solid #ffffff22;z-index:2}.tip b{font-size:15px}.tip em{font-style:normal;display:flex;gap:6px;align-items:center}.tip em::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.ax{display:flex;justify-content:space-between;margin:8px 8px 0;color:var(--mu);font-size:11.5px}
/* ranking */
.tp{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;padding:10px 4px;border:0;border-bottom:1px solid var(--ln);background:transparent;text-align:left;border-radius:0}.tp:last-child{border-bottom:0}.tp:hover{background:#ff3b4e0f}
.rk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:800 12.5px Inter,sans-serif;background:#80808026;color:var(--mu)}.r1{background:#ffc629;color:#3a2a00}.r2{background:#cfd5e0;color:#26303f}.r3{background:#e0a070;color:#3a1e08}
.av{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--av);color:var(--avt);font:700 13px Sora,Inter,sans-serif}
.tpn{display:flex;flex-direction:column;gap:6px;min-width:0}.tpn b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tpn i{display:block;height:4px;border-radius:99px;background:var(--ac);width:var(--w);min-width:6px;opacity:.9}.tpn small{color:var(--mu);font-size:12px}
.tpv{display:flex;flex-direction:column;align-items:flex-end}.tpv b{font:800 18px Sora,Inter,sans-serif;font-variant-numeric:tabular-nums}.tpv small{font-size:11.5px;color:var(--mu)}
/* rosca */
.dn{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;min-height:190px}
.dnw{position:relative;width:clamp(130px,11vw,158px);aspect-ratio:1;flex:none}.dnw svg{width:100%;height:100%;display:block}.dnt{stroke:var(--ln2)}
.dnc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.dnc b{font:800 clamp(24px,2vw,32px)/1 Sora,Inter,sans-serif}.dnc small{color:var(--mu);font-size:12px;margin-top:3px}
.lg2{list-style:none;margin:0;padding:0;display:grid;gap:12px;flex:1;min-width:150px}.lg2 li{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;font-size:14px}.lg2 i{width:11px;height:11px;border-radius:50%}.lg2 small{color:var(--mu);min-width:34px;text-align:right}
/* lojas */
.lj{display:grid;gap:14px;grid-template-columns:repeat(3,minmax(0,1fr));margin:0 0 14px}
.lc{position:relative;text-align:left;width:100%;padding:18px;border-radius:20px;background:var(--card);border:1px solid var(--ln2);box-shadow:var(--sh);overflow:hidden}
.lc::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c)}
.lc h3{margin:0 0 2px;font:800 18px Sora,Inter,sans-serif}.lc .ad{font-size:12.5px;color:var(--mu);margin-bottom:14px;min-height:34px}
.mm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mm div{padding:10px 6px;border-radius:14px;border:1px solid var(--ln2);text-align:center}.mm b{display:block;font:800 20px Sora,Inter,sans-serif}.mm span{font-size:11.5px;color:var(--mu)}
/* acesso rápido */
.qa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.qa button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:16px 6px;min-height:92px;border-radius:16px;border:1px solid var(--ln2);background:transparent;transition:background .15s,transform .15s}.qa button:hover{background:#ff3b4e14;transform:translateY(-2px)}
.qa span{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:#ff3b4e1f;color:var(--ac)}.qa svg{width:22px;height:22px}.qa b{font:700 13px Inter,sans-serif}
/* resumo */
.rs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.rs div{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;padding:12px 14px;border-radius:16px;border:1px solid var(--ln2)}
.rs span{grid-row:1 / span 2;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#ff3b4e1f;color:var(--ac)}.rs svg{width:20px;height:20px}
.rs b{font:800 22px/1.1 Sora,Inter,sans-serif;font-variant-numeric:tabular-nums}.rs small{color:var(--mu);font-size:12.5px}
/* lista de vendedores */
.vr{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:12px;width:100%;padding:11px 4px;border:0;border-bottom:1px solid var(--ln);background:transparent;text-align:left;border-radius:0}.vr:last-child{border-bottom:0}.vr:hover{background:#ff3b4e0f}
.vr .lt{display:flex;flex-direction:column;min-width:0}.vr .lt b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vr .lt small{color:var(--mu);font-size:12px}
.vn{display:flex;flex-direction:column;align-items:flex-end;min-width:56px}.vn b{font:800 16px Sora,Inter,sans-serif;font-variant-numeric:tabular-nums}.vn small{font-size:11px;color:var(--mu)}
.sus{font-style:normal;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;background:#ff5d6c22;color:#ff6b78;margin-left:6px}
.bs{width:100%;padding:12px 16px;border-radius:14px;border:1px solid var(--ln2);background:transparent;color:var(--tx);font:500 15px Inter,sans-serif;margin:0 0 12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}.chips button{border:1px solid var(--ln2);background:transparent;border-radius:99px;padding:7px 14px;font:700 13px Inter,sans-serif}.chips button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--tab);color:var(--mu);font-weight:700}.tag.ok{background:#2ee6a622;color:var(--okk)}.tag.am{background:#f2b44122;color:var(--wnn)}
.cli{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--ln)}.cli:first-of-type{border-top:0}.cli a{color:var(--c1);text-decoration:none;font-weight:700}
.cli .tpn{flex:1}.cli>b{margin-left:auto;font-family:Sora,Inter,sans-serif}.cli .tpn small{white-space:normal}.cli a{white-space:nowrap}
/* modal */
.md{position:fixed;inset:0;z-index:95;display:grid;place-items:end center;padding:0;background:#000a;backdrop-filter:blur(4px)}
.mb{width:min(640px,100%);max-height:94vh;overflow:auto;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));border-radius:22px 22px 0 0;background:var(--card);background-color:var(--bg);border:1px solid var(--ln2);box-shadow:0 30px 80px -20px #000}
#R.lt .mb{background:#fff}
@media(min-width:700px){.md{place-items:center;padding:18px}.mb{border-radius:22px}}
.mh{display:flex;align-items:center;gap:12px;margin-bottom:6px}.mh>div{min-width:0;flex:1}.mh b{display:block;font:800 18px Sora,Inter,sans-serif;overflow-wrap:anywhere}.mh small{color:var(--mu);font-size:13px}
.x{width:38px;height:38px;border-radius:50%;border:1px solid var(--ln2);background:transparent;font-size:16px;flex:none}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.mg div{padding:14px;border-radius:16px;border:1px solid var(--ln2)}.mg b{display:block;font:800 26px/1.1 Sora,Inter,sans-serif;font-variant-numeric:tabular-nums}.mg small{display:block;margin-top:4px;color:var(--mu);font-size:12.5px}
.sec{border:1px solid var(--ln2);border-radius:18px;padding:14px;margin:0 0 12px}.sec>b{display:block;margin-bottom:6px}
.ac{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
/* relatório impresso */
#rel{background:#fff;color:#111;border-radius:14px;padding:20px;font-size:13.5px}#rel h1{font:800 22px Sora,Inter,sans-serif;margin:0}#rel h4{margin:16px 0 6px;font-size:15px}
#rel table{width:100%;border-collapse:collapse;font-size:13px}#rel th,#rel td{padding:7px 6px;text-align:right;border-bottom:1px solid #ddd}#rel th:first-child,#rel td:first-child{text-align:left}#rel th{color:#555;font-size:11.5px}
#rel .t5 th:nth-child(2),#rel .t5 td:nth-child(2){text-align:left}.ov{overflow-x:auto}
#rel .kk{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}@media(min-width:620px){#rel .kk{grid-template-columns:repeat(4,1fr)}}#rel .kk div{border:1px solid #ddd;border-radius:8px;padding:8px}#rel .kk b{display:block;font-size:20px}
/* barra inferior */
.nav{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:60;padding:6px;display:flex;gap:4px;overflow-x:auto;background:var(--bar);border:1px solid var(--ln2);border-radius:22px;box-shadow:0 22px 56px -16px #000a;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);scrollbar-width:none}.nav::-webkit-scrollbar{display:none}
.nav button{position:relative;flex:1 0 auto;min-width:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:9px 8px 8px;border-radius:17px;border:1px solid transparent;background:transparent;color:var(--mu);font:600 11px/1.1 Inter,sans-serif}
.nav button svg{width:22px;height:22px}.nav button:hover{background:#ff3b4e14;color:var(--tx)}
.nav button.on{background:linear-gradient(135deg,#ff3b4e,#b00d25);color:#fff;border-color:#ff6b7d66;box-shadow:0 10px 22px -10px #ff3b4ecc}
@media(min-width:1000px){.nav{left:50%;right:auto;transform:translateX(-50%);bottom:16px;width:max-content;max-width:min(1240px,calc(100vw - 32px));padding:8px;border-radius:28px}.nav button{min-width:84px;padding:10px 14px 9px;font-size:12px;border-radius:19px}}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.err{max-width:440px;margin:18vh auto;text-align:center;padding:0 20px}.err h1{font:800 22px Sora,Inter,sans-serif}
@media(max-width:1180px){.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g2>:last-child{grid-column:1 / -1}.kg{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){.g1{grid-template-columns:minmax(0,1fr)}.lj{grid-template-columns:minmax(0,1fr)}}
@media(max-width:700px){.g2{grid-template-columns:minmax(0,1fr)}.nh-dt{display:none}.tb{width:100%;display:grid;grid-template-columns:1fr 1fr}.tbb.pri{grid-column:1 / -1}.tbb{padding:0 12px}.vr{grid-template-columns:auto minmax(0,1fr) auto}.vr .vn.v{display:none}}
@media(max-width:520px){.kg{gap:10px}.k1{padding:14px 12px 12px}.k1i{display:none}.k1l{font-size:12.5px}.k1n{font-size:26px}}
@media(max-width:400px){.nh-t small{display:none}.nh-lg svg{height:36px}}
@media print{html,body{background:#fff!important}#R{display:none!important}#prt{display:block!important}#prt .md{position:static;background:none;display:block;padding:0}#prt .mb{max-height:none;border:0;box-shadow:none;background:#fff;width:100%;padding:0}#prt .noprt{display:none!important}}
#prt{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="R"><div class="w"><p class="mu" style="text-align:center;padding:40vh 0 0">Carregando…</p></div></div>

function acesso(gs){return`<div class="qa">${gs.slice(0,3).map((g,i)=>`<button onclick="relatorio(${i})"><span>${ico('doc')}</span><b>Relatório ${esc(curto(g.nome))}</b></button>`).join('')}<button onclick="busca()"><span>${ico('search')}</span><b>Buscar vendedor</b></button><button onclick="relatorio('all')"><span>${ico('dl')}</span><b>Relatório geral</b></button><button onclick="setT('vend')"><span>${ico('vend')}</span><b>Vendedores</b></button></div>`}
function resumo(T){const it=[['vend','Vendedores',T.vend],['check','Com movimento',T.ativos],['cad','Fichas',T.fichas],['doc','Contratos',T.contratos],['wa','Cliques WhatsApp',T.whatsapp],['share','Compartilhamentos',T.comp]];return`<section class="card"><div class="ch-h"><div><h3>Resumo do período</h3><small>${esc(PER[DIAS])}</small></div></div><div class="rs">${it.map(x=>`<div><span>${ico(x[0])}</span><b>${N(x[2])}</b><small>${x[1]}</small></div>`).join('')}</div></section>`}
function vlinha(v,mx){return`<button class="vr" onclick="abreV('${esc(v.id)}')"><span class="av">${esc(ini(v.nome))}</span><span class="lt"><b>${esc(v.nome)}${v.suspenso?'<em class="sus">suspenso</em>':''}</b><small>/${esc(v.slug)} · ${N(v.fichas)} fichas · ${N(v.contratos)} contratos</small></span><span class="vn v"><b>${N(v.visitas)}</b><small>visitas</small></span><span class="vn"><b>${N(v.clientes)}</b><small>${v.clientes===1?'cliente':'clientes'}</small></span></button>`}
/* telas */
function head(){const dt=new Date().toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short',timeZone:'America/Rio_Branco'}).replace(/\./g,'');return`<header class="nh"><span class="nh-lg">${LGI}</span><div class="nh-t"><b>Olá, Marcelo!</b><small>Bem-vindo ao painel do diretor</small></div><div class="nh-r"><span class="nh-dt">${esc(dt.charAt(0).toUpperCase()+dt.slice(1))} · ${esc(new Date(D.gerado).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',timeZone:'America/Rio_Branco'}))}</span><button class="nh-b" id="rf" aria-label="Atualizar" onclick="carrega(1)">${ico('rf')}</button><button class="nh-u" aria-label="Menu" onclick="menu(event)">MD</button></div></header>`}
function perSel(){return`<div class="per" role="tablist">${[[1,'24 h'],[7,'7 dias'],[30,'30 dias'],[0,'Tudo']].map(p=>`<button class="${DIAS===p[0]?'on':''}" onclick="setP(${p[0]})">${p[1]}</button>`).join('')}</div>`}
function hero(T){return`<section class="hero"><div class="ht"><h2>Painel do Diretor</h2><p>Visão completa das lojas, vendedores e clientes</p><span class="hm"><i></i><span><b>${N(T.ativos)}</b> de ${N(T.vend)} vendedores com movimento · ${esc(PER[DIAS])}</span></span></div><div class="tb"><button class="tbb" onclick="busca()">${ico('search')}<span>Buscar vendedor</span></button><button class="tbb" onclick="carrega(1)">${ico('rf')}<span>Atualizar</span></button><button class="tbb pri" onclick="relatorio('all')">${ico('dl')}<span>Relatório geral</span></button></div></section>`}
function telaIni(gs,T){const ids=gs.map(g=>g.id),tr1=tend(serieDe('visitas',ids,NSER)),tr2=tend(serieDe('clientes',ids,NSER));
  return`${hero(T)}${perSel()}${kpis(gs,T,tr1,tr2)}<div class="g1">${cardGrafico(gs)}${cardTop(gs)}</div><h3 style="margin:18px 2px 10px;font:800 17px Sora,Inter,sans-serif">Lojas</h3>${lojasCards(gs)}<div class="g2"><section class="card"><div class="ch-h"><div><h3>Clientes por loja</h3><small>${esc(PER[DIAS])}</small></div></div>${rosca(gs)}</section><section class="card"><div class="ch-h"><div><h3>Compartilhamentos</h3><small>links e motos enviados</small></div></div><div class="rs" style="grid-template-columns:1fr">${gs.map(g=>{const t=soma(g.v);return`<div style="--c:${g.cor}"><span>${ico('share')}</span><b>${N(t.comp)}</b><small>${esc(g.nome)}</small></div>`}).join('')}</div><p class="vz" style="font-size:12.5px">Passaram a ser contados agora; antes não eram registrados.</p></section><section class="card"><div class="ch-h"><div><h3>Acesso rápido</h3><small>relatórios e busca</small></div></div>${acesso(gs)}</section></div>${resumo(T)}`}
function telaLoja(gs,i){const g=gs[i];if(!g)return'';const t=soma(g.v),tr1=tend(serieDe('visitas',[g.id],NSER)),tr2=tend(serieDe('clientes',[g.id],NSER)),all=ordena(g.v);
  return`<section class="hero" style="--c:${g.cor}"><div class="ht"><h2>${esc(g.nome)}</h2><p>${esc(g.endereco||'Vendedores sem loja definida')}</p><span class="hm"><i></i><span><b>${N(t.ativos)}</b> de ${N(t.vend)} vendedores com movimento</span></span></div><div class="tb"><button class="tbb pri" onclick="relatorio(${i})">${ico('doc')}<span>Gerar relatório da loja</span></button></div></section>${perSel()}${kpis([g],t,tr1,tr2)}<div class="g1">${cardGrafico([g],(MET==='v'?'Visitas':'Clientes novos')+' · '+esc(g.nome))}<section class="card"><div class="ch-h"><div><h3>Top 5 vendedores</h3><small>${esc(PER[DIAS])}</small></div></div>${topRows(g.v)}</section></div><section class="card"><div class="ch-h"><div><h3>Todos os vendedores (${all.length})</h3><small>toque para inspecionar</small></div></div>${all.map(v=>vlinha(v)).join('')||'<p class="vz">Nenhum vendedor.</p>'}</section>`}
function telaVend(gs){const q=norm(VQ),L=ordena(D.vendedores.filter(v=>(VF==='all'||String(v.loja_id)===VF)&&(!q||norm(v.nome+' '+v.slug).includes(q))));
  return`<section class="hero"><div class="ht"><h2>Vendedores</h2><p>${N(D.vendedores.length)} vendedores nas lojas · ${esc(PER[DIAS])}</p></div></section>${perSel()}<input class="bs" id="vq" type="search" placeholder="Buscar vendedor" value="${esc(VQ)}" oninput="setQ(this.value)"><div class="chips"><button class="${VF==='all'?'on':''}" onclick="setF('all')">Todos</button>${gs.map(g=>`<button class="${VF===String(g.id)?'on':''}" onclick="setF('${esc(g.id)}')">${esc(g.nome)}</button>`).join('')}</div><section class="card" id="vl2">${L.map(v=>vlinha(v)).join('')||'<p class="vz">Nenhum vendedor encontrado.</p>'}</section>`}
function telaRel(gs,T){return`<section class="hero"><div class="ht"><h2>Relatórios</h2><p>Gere o relatório de cada loja ou o geral, em PDF, por cópia ou por WhatsApp</p></div><div class="tb"><button class="tbb pri" onclick="relatorio('all')">${ico('dl')}<span>Relatório geral</span></button></div></section>${perSel()}<div class="lj">${gs.map((g,i)=>{const t=soma(g.v);return`<div class="lc" style="--c:${g.cor}"><h3>${esc(g.nome)}</h3><div class="ad">${N(t.visitas)} visitas · ${N(t.clientes)} clientes · ${N(t.fichas+t.contratos)} fichas e contratos</div><button class="tbb pri" style="width:100%" onclick="relatorio(${i})">${ico('doc')}<span>Gerar relatório</span></button></div>`}).join('')}</div>`}
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function setQ(v){VQ=v;const g=grupos(),q=norm(v),L=ordena(D.vendedores.filter(x=>(VF==='all'||String(x.loja_id)===VF)&&(!q||norm(x.nome+' '+x.slug).includes(q))));$('vl2').innerHTML=L.map(x=>vlinha(x)).join('')||'<p class="vz">Nenhum vendedor encontrado.</p>'}
function setF(f){VF=f;draw()}
function nav(gs){const T=[['ini','Início','dash']].concat(gs.map((g,i)=>['l'+i,curto(g.nome),'loja']),[['vend','Vendedores','vend'],['rel','Relatórios','doc']]);return`<nav class="nav" aria-label="Seções">${T.map(t=>`<button class="${TAB===t[0]?'on':''}" onclick="setT('${t[0]}')">${ico(t[2])}<span>${esc(t[1])}</span></button>`).join('')}</nav>`}
function draw(keep){const y=keep?scrollY:0,gs=grupos(),T=soma(D.vendedores.filter(v=>gs.some(g=>g.v.includes(v))));
  let b;if(TAB==='ini')b=telaIni(gs,T);else if(TAB==='vend')b=telaVend(gs);else if(TAB==='rel')b=telaRel(gs,T);else b=telaLoja(gs,+TAB.slice(1));
  $('R').innerHTML=`<div class="w">${head()}${b}</div>${nav(gs)}`;aplicaTema();if(keep)scrollTo(0,y)}
function setP(d){DIAS=d;carrega()}function setT(t){TAB=t;draw();scrollTo(0,0)}
function menu(e){e.stopPropagation();if($('pop')){$('pop').remove();return}const m=document.createElement('div');m.id='pop';m.className='pop';m.innerHTML=[['Buscar vendedor','search','busca()'],[TEMA==='lt'?'Tema escuro':'Tema claro','tema','temaTroca()'],['Atualizar','rf','carrega(1)'],['Sair deste aparelho','sair','sair()']].map(x=>`<button onclick="document.getElementById('pop')&&document.getElementById('pop').remove();${x[2]}">${ico(x[1])}<span>${x[0]}</span></button>`).join('');$('R').appendChild(m);setTimeout(()=>document.addEventListener('click',()=>{const p=$('pop');if(p)p.remove()},{once:true}),0)}
function sair(){if(!confirm('Sair deste aparelho? Para entrar de novo será preciso abrir o link completo.'))return;try{localStorage.removeItem(SK)}catch(e){}TOK='';D=null;negado()}
/* modais */
function fecha(){const m=$('md');if(m)m.remove()}
function modal(h){fecha();const m=document.createElement('div');m.className='md';m.id='md';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.onclick=e=>{if(e.target===m)fecha()};m.innerHTML=`<div class="mb">${h}</div>`;$('R').appendChild(m)}
function busca(){modal(`<div class="mh"><div><b>Buscar vendedor</b><small>nome ou endereço do site</small></div><button class="x" onclick="fecha()" aria-label="Fechar">✕</button></div><input class="bs" id="bq" type="search" placeholder="Digite o nome" oninput="buscaL(this.value)" autofocus><div id="br"></div>`);buscaL('');setTimeout(()=>{const i=$('bq');if(i)i.focus()},50)}
function buscaL(v){const q=norm(v),L=ordena(D.vendedores.filter(x=>!q||norm(x.nome+' '+x.slug).includes(q))).slice(0,30);$('br').innerHTML=L.map(x=>vlinha(x)).join('')||'<p class="vz">Nenhum vendedor encontrado.</p>'}
async function abreV(id){const v=D.vendedores.find(x=>x.id===id);if(!v)return;modal(`<div class="mh"><span class="av">${esc(ini(v.nome))}</span><div><b>${esc(v.nome)}</b><small>Carregando…</small></div><button class="x" onclick="fecha()" aria-label="Fechar">✕</button></div>`);
  let d;try{d=await rpc('diretor_vendedor',{p_slug:SL,p_token:TOK,p_vendedor:id,p_dias:DIAS||null})}catch(e){modal('<div class="mh"><div><b>Erro</b></div><button class="x" onclick="fecha()">✕</button></div><p class="vz">Não consegui abrir este vendedor.</p>');return}
  const lj=(D.lojas.find(l=>l.id===v.loja_id)||{}).nome||'Sem loja',dd=(()=>{const m={};d.dias.forEach(x=>m[x.dia]=x.n);return dias(30).map(x=>m[x]||0)})(),mx=Math.max(1,...dd);
  const tel=t=>{const n=String(t||'').replace(/\D/g,'');return n?`<a href="https://wa.me/${n.length<=11?'55'+n:n}" target="_blank" rel="noopener">${esc(t)}</a>`:'<span class="mu">sem telefone</span>'};
  const lista=(a,f)=>a.length?a.map(f).join(''):'<p class="vz">Sem dados no período.</p>';
  modal(`<div class="mh"><span class="av">${esc(ini(v.nome))}</span><div><b>${esc(v.nome)}</b><small>${esc(lj)} · /${esc(v.slug)} · ${esc(PER[DIAS])}</small></div><button class="x" onclick="fecha()" aria-label="Fechar">✕</button></div>
  <div class="mg"><div><b>${N(v.visitas)}</b><small>Visitas · ${N(v.visitantes)} pessoas</small></div><div><b>${N(v.clientes)}</b><small>Clientes · ${PCT(v.clientes,v.visitantes)}</small></div><div><b>${N(v.fichas)} · ${N(v.contratos)}</b><small>Fichas · contratos</small></div><div><b>${N(v.whatsapp)}</b><small>WhatsApp · ${N(v.moto_views)} motos vistas</small></div></div>
  <div class="sec"><b>Visitas por dia (30 dias)</b><div style="display:flex;align-items:flex-end;gap:3px;height:70px">${dd.map(x=>`<i style="flex:1;height:${Math.max(3,Math.round(x/mx*100))}%;background:var(--ac);border-radius:3px 3px 0 0;opacity:.9" title="${x}"></i>`).join('')}</div><small class="mu">Última visita: ${esc(DT(v.ultima_visita))} · último cliente: ${esc(DT(v.ultimo_cliente))}</small></div>
  <div class="sec"><b>Compartilhamentos: ${N(v.comp_link+v.comp_moto)}</b><small class="mu">${N(v.comp_link)} do link do site · ${N(v.comp_moto)} de motos</small>${d.compartilhamentos.slice(0,8).map(c=>`<div class="cli"><span class="tag">${c.tipo==='comp_link'?'link':'moto'}</span><div class="tpn"><b>${esc(c.moto||'Link do site')}</b></div><small class="mu">${esc(DT(c.criado))}</small></div>`).join('')}</div>
  <div class="sec"><b>Motos mais vistas</b>${lista(d.motos,m=>`<div class="cli"><div class="tpn"><b>${esc(m.moto)}</b></div><b>${N(m.n)}</b></div>`)}</div>
  <div class="sec"><b>De onde vêm as visitas</b>${lista(d.origens,m=>`<div class="cli"><div class="tpn"><b>${esc(m.origem)}</b></div><b>${N(m.n)}</b></div>`)}</div>
  <div class="sec"><b>Clientes cadastrados (${d.clientes.length}${d.clientes.length>=300?'+':''})</b>${lista(d.clientes,c=>`<div class="cli"><div class="tpn"><b>${esc(c.nome||'Sem nome')}</b><small>${esc((c.motos||[]).join(', ')||'sem moto')} · ${esc(DT(c.ultimo))}</small></div><div style="text-align:right;display:grid;gap:3px">${c.contrato?'<span class="tag ok">contrato</span>':''}${c.ficha?'<span class="tag am">ficha</span>':''}<span>${tel(c.telefone)}</span></div></div>`)}</div>`)}
function txtRel(g){const t=soma(g.v),tp=top5(g.v);return`*Relatório ${g.nome}* (${PER[DIAS]})\n\nVisitas: ${N(t.visitas)} (${N(t.visitantes)} pessoas)\nClientes cadastrados: ${N(t.clientes)}\nFichas: ${N(t.fichas)} · Contratos: ${N(t.contratos)}\nCliques no WhatsApp: ${N(t.whatsapp)}\nCompartilhamentos: ${N(t.comp)}\nVendedores com movimento: ${t.ativos} de ${t.vend}\n\n*Top 5 vendedores*\n${tp.map((v,i)=>`${i+1}. ${v.nome}: ${N(v.clientes)} clientes, ${N(v.visitas)} visitas`).join('\n')||'—'}`}
function txtGeral(){const gs=grupos();return`*Relatório geral das lojas* (${PER[DIAS]})\n\n`+gs.map(g=>{const t=soma(g.v),tp=top5(g.v)[0];return`*${g.nome}*: ${N(t.visitas)} visitas, ${N(t.clientes)} clientes, ${N(t.fichas)} fichas, ${N(t.contratos)} contratos${tp?`. Destaque: ${tp.nome} (${N(tp.clientes)} clientes)`:''}`}).join('\n')}
function relBloco(g){const t=soma(g.v),tp=top5(g.v),all=ordena(g.v);return`<h1>Loja ${esc(g.nome)}</h1><div style="color:#555">${esc(g.endereco||'')}</div>
  <h4>Resultado</h4><div class="kk"><div><b>${N(t.visitas)}</b>visitas</div><div><b>${N(t.clientes)}</b>clientes cadastrados</div><div><b>${N(t.fichas)} · ${N(t.contratos)}</b>fichas · contratos</div><div><b>${N(t.comp)}</b>compartilhamentos</div></div>
  <p>${N(t.visitantes)} pessoas visitaram os sites dos vendedores; ${PCT(t.clientes,t.visitantes)} viraram cliente cadastrado. Foram ${N(t.whatsapp)} cliques no WhatsApp e ${N(t.moto_views)} visualizações de motos. ${t.ativos} de ${t.vend} vendedores tiveram movimento.</p>
  <h4>Top 5 vendedores</h4><div class="ov"><table class="t5"><tr><th>#</th><th>Vendedor</th><th>Clientes</th><th>Visitas</th></tr>${tp.map((v,j)=>`<tr><td>${j+1}</td><td>${esc(v.nome)}</td><td>${N(v.clientes)}</td><td>${N(v.visitas)}</td></tr>`).join('')}</table></div>
  <h4>Todos os vendedores</h4><div class="ov"><table><tr><th>Vendedor</th><th>Visitas</th><th>Clientes</th><th>Fichas</th><th>Contratos</th><th>WhatsApp</th><th>Comp.</th></tr>${all.map(v=>`<tr><td>${esc(v.nome)}</td><td>${N(v.visitas)}</td><td>${N(v.clientes)}</td><td>${N(v.fichas)}</td><td>${N(v.contratos)}</td><td>${N(v.whatsapp)}</td><td>${N(v.comp_link+v.comp_moto)}</td></tr>`).join('')}</table></div>`}
function relatorio(i){const gs=grupos(),all=i==='all',g=all?null:gs[i];if(!all&&!g)return;
  const corpo=all?`<h1>Relatório geral das lojas</h1>${gs.map(x=>{const t=soma(x.v);return`<h4>${esc(x.nome)}</h4><p>${N(t.visitas)} visitas · ${N(t.clientes)} clientes · ${N(t.fichas)} fichas · ${N(t.contratos)} contratos · ${N(t.whatsapp)} cliques no WhatsApp · ${N(t.comp)} compartilhamentos</p><div class="ov"><table class="t5"><tr><th>#</th><th>Top 5</th><th>Clientes</th><th>Visitas</th></tr>${top5(x.v).map((v,j)=>`<tr><td>${j+1}</td><td>${esc(v.nome)}</td><td>${N(v.clientes)}</td><td>${N(v.visitas)}</td></tr>`).join('')}</table></div>`}).join('')}`:relBloco(g);
  modal(`<div class="mh noprt"><div><b>Relatório · ${all?'geral':esc(g.nome)}</b><small>${esc(PER[DIAS])}</small></div><button class="x" onclick="fecha()" aria-label="Fechar">✕</button></div><div class="ac noprt"><button class="tbb pri" onclick="imprime()">${ico('dl')}<span>Salvar PDF / imprimir</span></button><button class="tbb" onclick="copiaRel('${all?'all':i}')"><span>📋 Copiar resumo</span></button><button class="tbb" onclick="zapRel('${all?'all':i}')">${ico('wa')}<span>WhatsApp</span></button></div><div id="rel">${corpo}<p style="color:#777;font-size:12px;margin-top:14px">Gerado em ${esc(DT(D.gerado))} · ${esc(PER[DIAS])}</p></div>`)}
function imprime(){const m=$('md');$('prt').appendChild(m);window.print();setTimeout(()=>$('R').appendChild(m),300)}
function txtDe(i){return i==='all'?txtGeral():txtRel(grupos()[+i])}
function copiaRel(i){const t=txtDe(i);try{navigator.clipboard.writeText(t).then(()=>alert('Resumo copiado!'))}catch(e){prompt('Copie:',t)}}
function zapRel(i){window.open('https://wa.me/?text='+encodeURIComponent(txtDe(i)),'_blank','noopener')}
aplicaTema();carrega();
</script>
</body>
</html>
